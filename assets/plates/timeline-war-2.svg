<svg class="plate tlplate" viewBox="0 0 840 1188" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>Radio school to the Golden Gate</title><desc>A vertical timeline of Allen Sweigert's service. Years run down a rail at the left, to scale; each event sits in a row to its right.</desc><path class="tl-rail" d="M126,78 126,1151"/><path class="tl-year-rule" d="M82,78 822,78"/><text class="tl-year" x="76" y="83" text-anchor="end">1941</text><path class="tl-year-rule" d="M82,972.167 822,972.167"/><text class="tl-year" x="76" y="977.167" text-anchor="end">1942</text><path class="tl-mark tl-unit" d="M126,194.434 130.6,199.034 126,203.634 121.4,199.034Z"/><path class="tl-tie" d="M133,199.034 150,199.034 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">19 Feb 1941</text><text class="tl-title" x="0" y="6">Savannah air base dedicated</text><text class="tl-detail" x="0" y="22">The installation he would enlist into weeks later</text></g><path class="tl-mark tl-unit" d="M126,201.778 130.6,206.378 126,210.978 121.4,206.378Z"/><path class="tl-tie" d="M133,206.378 150,206.378 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">22 Feb 1941</text><text class="tl-title" x="0" y="6">On to Camp Stewart</text><text class="tl-detail" x="0" y="22">Georgia, the new antiaircraft training centre</text></g><path class="tl-mark tl-record" d="M126,321.441 130.6,326.041 126,330.641 121.4,326.041Z"/><path class="tl-tie" d="M133,326.041 150,326.041 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">10 Apr 1941</text><text class="tl-title" x="0" y="6">Guard out, Air Corps in</text><text class="tl-detail" x="0" y="22">Discharged at his own request; enlisted at Savannah</text></g><path class="tl-mark tl-press" d="M126,435.131 130.6,439.731 126,444.331 121.4,439.731Z"/><path class="tl-tie" d="M133,439.731 150,439.731 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">26 May 1941</text><text class="tl-title" x="0" y="6">Catherine graduates from Kutztown</text><text class="tl-detail" x="0" y="22">Kutztown State Teachers' College, in the new Schaeffer auditorium</text></g><path class="tl-mark tl-press" d="M126,435.131 130.6,439.731 126,444.331 121.4,439.731Z"/><path class="tl-tie" d="M133,439.731 150,439.731 150,317.5 160,317.5"/><g class="tl-row" transform="translate(168,317.5)"><text class="tl-date" x="0" y="-11">late May 1941</text><text class="tl-title" x="0" y="6">Scott Field course begins</text><text class="tl-detail" x="0" y="22">Twenty-two weeks, radio operator-mechanic</text></g><path class="tl-mark tl-memory tl-bar" d="M126,78 126,972.167"/><path class="tl-tie" d="M133,525.083 150,525.083 150,371.5 160,371.5"/><g class="tl-row" transform="translate(168,371.5)"><text class="tl-date" x="0" y="-11">1941</text><text class="tl-title tl-remembered" x="0" y="6">Last leave at home</text><text class="tl-detail" x="0" y="22">About half a day, his last before sailing</text></g><path class="tl-mark tl-record tl-bar" d="M126,78 126,972.167"/><path class="tl-tie" d="M133,525.083 150,525.083 150,425.5 160,425.5"/><g class="tl-row" transform="translate(168,425.5)"><text class="tl-date" x="0" y="-11">1941</text><text class="tl-title" x="0" y="6">Photographed at Pendleton</text><text class="tl-detail" x="0" y="22">A print he labelled "Camp Endelton, VA, '41"</text></g><path class="tl-mark tl-letter" d="M126,810.179 130.6,814.779 126,819.379 121.4,814.779Z"/><path class="tl-tie" d="M133,814.779 150,814.779 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">27 Oct 1941</text><text class="tl-title" x="0" y="6">Graduates Scott Field</text><text class="tl-detail" x="0" y="22">"Graduated from the Air Corps technical schools"</text></g><path class="tl-mark tl-record" d="M126,857.77 130.6,862.37 126,866.97 121.4,862.37Z"/><path class="tl-tie" d="M133,862.37 150,862.37 150,533.5 160,533.5"/><g class="tl-row" transform="translate(168,533.5)"><text class="tl-date" x="0" y="-11">16–28 Nov 1941</text><text class="tl-title" x="0" y="6">Carolina Maneuvers</text><text class="tl-detail" x="0" y="22">His photograph back reads "Pope Field / Maneuvers / Nov. 1941"</text></g><path class="tl-mark tl-letter" d="M126,910.257 130.6,914.857 126,919.457 121.4,914.857Z"/><path class="tl-tie" d="M133,914.857 150,914.857 150,587.5 160,587.5"/><g class="tl-row" transform="translate(168,587.5)"><text class="tl-date" x="0" y="-11">7 Dec 1941</text><text class="tl-title" x="0" y="6">Last sight of Battery F</text><text class="tl-detail" x="0" y="22">Visiting Camp Stewart when Pearl Harbor news came in</text></g><path class="tl-mark tl-memory tl-bar" d="M126,897.653 126,972.167"/><path class="tl-tie" d="M133,934.91 150,934.91 150,641.5 160,641.5"/><g class="tl-row" transform="translate(168,641.5)"><text class="tl-date" x="0" y="-11">Dec 1941</text><text class="tl-title tl-remembered" x="0" y="6">Squadron moves inland</text><text class="tl-detail" x="0" y="22">Savannah to Augusta, Georgia, foxholes already dug</text></g><path class="tl-mark tl-memory tl-bar" d="M126,972.167 126,1046.68"/><path class="tl-tie" d="M133,1009.42 150,1009.42 150,695.5 160,695.5"/><g class="tl-row" transform="translate(168,695.5)"><text class="tl-date" x="0" y="-11">early Jan 1942</text><text class="tl-title tl-remembered" x="0" y="6">Cadre to Palm Beach</text><text class="tl-detail" x="0" y="22">Anti-submarine group; sent back the next day</text></g><path class="tl-mark tl-unit" d="M126,1014.08 130.6,1018.68 126,1023.28 121.4,1018.68Z"/><path class="tl-tie" d="M133,1018.68 150,1018.68 150,749.5 160,749.5"/><g class="tl-row" transform="translate(168,749.5)"><text class="tl-date" x="0" y="-11">19 Jan 1942</text><text class="tl-title" x="0" y="6">Troop train leaves Savannah</text><text class="tl-detail" x="0" y="22">Group's station at Savannah ends after fifteen months</text></g><path class="tl-mark tl-unit" d="M126,1026.32 130.6,1030.92 126,1035.52 121.4,1030.92Z"/><path class="tl-tie" d="M133,1030.92 150,1030.92 150,803.5 160,803.5"/><g class="tl-row" transform="translate(168,803.5)"><text class="tl-date" x="0" y="-11">24 Jan 1942</text><text class="tl-title" x="0" y="6">Oakland, and a warehouse</text><text class="tl-detail" x="0" y="22">Seven days waiting, cots up, each squadron its area</text></g><path class="tl-mark tl-record" d="M126,1043.46 130.6,1048.06 126,1052.66 121.4,1048.06Z"/><path class="tl-tie" d="M133,1048.06 150,1048.06 150,857.5 160,857.5"/><g class="tl-row" transform="translate(168,857.5)"><text class="tl-date" x="0" y="-11">31 Jan 1942</text><text class="tl-title" x="0" y="6">Convoy 2030 sails</text><text class="tl-detail" x="0" y="22">USAT Ancon out of San Francisco; foreign service starts</text></g><path class="tl-mark tl-letter tl-bar" d="M126,1046.68 126,1121.19"/><path class="tl-tie" d="M133,1083.94 150,1083.94 150,911.5 160,911.5"/><g class="tl-row" transform="translate(168,911.5)"><text class="tl-date" x="0" y="-11">at sea, Feb 1942</text><text class="tl-title" x="0" y="6">Made corporal at sea</text><text class="tl-detail" x="0" y="22">Inside a twenty-five day window; no day given</text></g><path class="tl-mark tl-unit" d="M126,1103.29 130.6,1107.89 126,1112.49 121.4,1107.89Z"/><path class="tl-tie" d="M133,1107.89 150,1107.89 150,965.5 160,965.5"/><g class="tl-row" transform="translate(168,965.5)"><text class="tl-date" x="0" y="-11">25 Feb 1942</text><text class="tl-title" x="0" y="6">Ancon docks at Brisbane</text><text class="tl-detail" x="0" y="22">Arrived with no aeroplanes and a lieutenant commanding</text></g><path class="tl-mark tl-unit" d="M126,1103.29 130.6,1107.89 126,1112.49 121.4,1107.89Z"/><path class="tl-tie" d="M133,1107.89 150,1107.89 150,1019.5 160,1019.5"/><g class="tl-row" transform="translate(168,1019.5)"><text class="tl-date" x="0" y="-11">25 Feb 1942</text><text class="tl-title" x="0" y="6">Under canvas at Ascot</text><text class="tl-detail" x="0" y="22">"Some racetrack" — the Brisbane staging camp</text></g><path class="tl-mark tl-unit" d="M126,1136.19 130.6,1140.79 126,1145.39 121.4,1140.79Z"/><path class="tl-tie" d="M133,1140.79 150,1140.79 150,1073.5 160,1073.5"/><g class="tl-row" transform="translate(168,1073.5)"><text class="tl-date" x="0" y="-11">8 Mar 1942</text><text class="tl-title" x="0" y="6">Entrains for Charters Towers</text><text class="tl-detail" x="0" y="22">89th and 90th Squadrons go inland</text></g><path class="tl-mark tl-unit" d="M126,1141.09 130.6,1145.69 126,1150.29 121.4,1145.69Z"/><path class="tl-tie" d="M133,1145.69 150,1145.69 150,1127.5 160,1127.5"/><g class="tl-row" transform="translate(168,1127.5)"><text class="tl-date" x="0" y="-11">10 Mar 1942</text><text class="tl-title" x="0" y="6">Group at Charters Towers</text><text class="tl-detail" x="0" y="22">A strip begun 16 February; days old, not years</text></g><g class="tl-stick" transform="translate(92,252.833)"><path class="tl-stick-bar" d="M0,0 0,894.167"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,894.167 4,894.167"/><text class="tl-stick-label" x="8" y="451.083">one year</text></g><text class="pl-kicker" x="8" y="22">THE SERVICE YEARS · 2 of 4</text><text class="pl-title" x="8" y="48">Radio school to the Golden Gate</text><text class="pl-sub" x="8" y="66">20 entries between 19 Feb 1941 and 10 Mar 1942.</text></svg>