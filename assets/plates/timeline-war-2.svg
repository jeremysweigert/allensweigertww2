<svg class="plate tlplate" viewBox="0 0 840 1242" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>Radio school to the Golden Gate</title><desc>A vertical timeline of Allen Sweigert's service. Years run down a rail at the left, to scale; each event sits in a row to its right.</desc><path class="tl-rail" d="M126,78 126,1205"/><path class="tl-year-rule" d="M82,78 822,78"/><text class="tl-year" x="76" y="83" text-anchor="end">1941</text><path class="tl-year-rule" d="M82,1017.17 822,1017.17"/><text class="tl-year" x="76" y="1022.17" text-anchor="end">1942</text><path class="tl-mark tl-unit" d="M126,200.525 130.6,205.125 126,209.725 121.4,205.125Z"/><path class="tl-tie" d="M133,205.125 150,205.125 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">19 Feb 1941</text><text class="tl-title" x="0" y="6">Savannah air base dedicated</text><text class="tl-detail" x="0" y="22">The installation he would enlist into weeks later</text></g><path class="tl-mark tl-unit" d="M126,208.239 130.6,212.839 126,217.439 121.4,212.839Z"/><path class="tl-tie" d="M133,212.839 150,212.839 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">22 Feb 1941</text><text class="tl-title" x="0" y="6">On to Camp Stewart</text><text class="tl-detail" x="0" y="22">Georgia, the new antiaircraft training centre</text></g><path class="tl-mark tl-record" d="M126,333.924 130.6,338.524 126,343.124 121.4,338.524Z"/><path class="tl-tie" d="M133,338.524 150,338.524 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">10 Apr 1941</text><text class="tl-title" x="0" y="6">Guard out, Air Corps in</text><text class="tl-detail" x="0" y="22">Discharged at his own request; enlisted at Savannah</text></g><path class="tl-mark tl-record" d="M126,333.924 130.6,338.524 126,343.124 121.4,338.524Z"/><path class="tl-tie" d="M133,338.524 150,338.524 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">10 Apr 1941</text><text class="tl-title" x="0" y="6">The Army's enlistment record</text><text class="tl-detail" x="0" y="22">Air Corps, Regular Army; place given as Camp Stewart</text></g><path class="tl-mark tl-press" d="M126,453.335 130.6,457.935 126,462.535 121.4,457.935Z"/><path class="tl-tie" d="M133,457.935 150,457.935 150,317.5 160,317.5"/><g class="tl-row" transform="translate(168,317.5)"><text class="tl-date" x="0" y="-11">26 May 1941</text><text class="tl-title" x="0" y="6">Catherine graduates from Kutztown</text><text class="tl-detail" x="0" y="22">Kutztown State Teachers' College, in the new Schaeffer auditorium</text></g><path class="tl-mark tl-press" d="M126,453.335 130.6,457.935 126,462.535 121.4,457.935Z"/><path class="tl-tie" d="M133,457.935 150,457.935 150,371.5 160,371.5"/><g class="tl-row" transform="translate(168,371.5)"><text class="tl-date" x="0" y="-11">late May 1941</text><text class="tl-title" x="0" y="6">Scott Field course begins</text><text class="tl-detail" x="0" y="22">Twenty-two weeks, radio operator-mechanic</text></g><path class="tl-mark tl-memory tl-bar" d="M126,78 126,1017.17"/><path class="tl-tie" d="M133,547.583 150,547.583 150,425.5 160,425.5"/><g class="tl-row" transform="translate(168,425.5)"><text class="tl-date" x="0" y="-11">1941</text><text class="tl-title tl-remembered" x="0" y="6">Last leave at home</text><text class="tl-detail" x="0" y="22">About half a day, his last before sailing</text></g><path class="tl-mark tl-record tl-bar" d="M126,78 126,1017.17"/><path class="tl-tie" d="M133,547.583 150,547.583 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">1941</text><text class="tl-title" x="0" y="6">Photographed at Pendleton</text><text class="tl-detail" x="0" y="22">A print he labelled "Camp Endelton, VA, '41"</text></g><path class="tl-mark tl-letter" d="M126,847.258 130.6,851.858 126,856.458 121.4,851.858Z"/><path class="tl-tie" d="M133,851.858 150,851.858 150,533.5 160,533.5"/><g class="tl-row" transform="translate(168,533.5)"><text class="tl-date" x="0" y="-11">27 Oct 1941</text><text class="tl-title" x="0" y="6">Graduates Scott Field</text><text class="tl-detail" x="0" y="22">"Graduated from the Air Corps technical schools"</text></g><path class="tl-mark tl-record" d="M126,897.244 130.6,901.844 126,906.444 121.4,901.844Z"/><path class="tl-tie" d="M133,901.844 150,901.844 150,587.5 160,587.5"/><g class="tl-row" transform="translate(168,587.5)"><text class="tl-date" x="0" y="-11">16–28 Nov 1941</text><text class="tl-title" x="0" y="6">Carolina Maneuvers</text><text class="tl-detail" x="0" y="22">His photograph back reads "Pope Field / Maneuvers / Nov. 1941"</text></g><path class="tl-mark tl-letter" d="M126,952.373 130.6,956.973 126,961.573 121.4,956.973Z"/><path class="tl-tie" d="M133,956.973 150,956.973 150,641.5 160,641.5"/><g class="tl-row" transform="translate(168,641.5)"><text class="tl-date" x="0" y="-11">7 Dec 1941</text><text class="tl-title" x="0" y="6">Last sight of Battery F</text><text class="tl-detail" x="0" y="22">Visiting Camp Stewart when Pearl Harbor news came in</text></g><path class="tl-mark tl-memory tl-bar" d="M126,938.903 126,1017.17"/><path class="tl-tie" d="M133,978.035 150,978.035 150,695.5 160,695.5"/><g class="tl-row" transform="translate(168,695.5)"><text class="tl-date" x="0" y="-11">Dec 1941</text><text class="tl-title tl-remembered" x="0" y="6">Squadron moves inland</text><text class="tl-detail" x="0" y="22">Savannah to Augusta, Georgia, foxholes already dug</text></g><path class="tl-mark tl-memory tl-bar" d="M126,1017.17 126,1095.43"/><path class="tl-tie" d="M133,1056.3 150,1056.3 150,749.5 160,749.5"/><g class="tl-row" transform="translate(168,749.5)"><text class="tl-date" x="0" y="-11">early Jan 1942</text><text class="tl-title tl-remembered" x="0" y="6">Cadre to Palm Beach</text><text class="tl-detail" x="0" y="22">Anti-submarine group; sent back the next day</text></g><path class="tl-mark tl-unit" d="M126,1061.42 130.6,1066.02 126,1070.62 121.4,1066.02Z"/><path class="tl-tie" d="M133,1066.02 150,1066.02 150,803.5 160,803.5"/><g class="tl-row" transform="translate(168,803.5)"><text class="tl-date" x="0" y="-11">19 Jan 1942</text><text class="tl-title" x="0" y="6">Troop train leaves Savannah</text><text class="tl-detail" x="0" y="22">Group's station at Savannah ends after fifteen months</text></g><path class="tl-mark tl-unit" d="M126,1074.28 130.6,1078.88 126,1083.48 121.4,1078.88Z"/><path class="tl-tie" d="M133,1078.88 150,1078.88 150,857.5 160,857.5"/><g class="tl-row" transform="translate(168,857.5)"><text class="tl-date" x="0" y="-11">24 Jan 1942</text><text class="tl-title" x="0" y="6">Oakland, and a warehouse</text><text class="tl-detail" x="0" y="22">Seven days waiting, cots up, each squadron its area</text></g><path class="tl-mark tl-record" d="M126,1092.28 130.6,1096.88 126,1101.48 121.4,1096.88Z"/><path class="tl-tie" d="M133,1096.88 150,1096.88 150,911.5 160,911.5"/><g class="tl-row" transform="translate(168,911.5)"><text class="tl-date" x="0" y="-11">31 Jan 1942</text><text class="tl-title" x="0" y="6">Convoy 2030 sails</text><text class="tl-detail" x="0" y="22">USAT Ancon out of San Francisco; foreign service starts</text></g><path class="tl-mark tl-letter tl-bar" d="M126,1095.43 126,1173.69"/><path class="tl-tie" d="M133,1134.56 150,1134.56 150,965.5 160,965.5"/><g class="tl-row" transform="translate(168,965.5)"><text class="tl-date" x="0" y="-11">at sea, Feb 1942</text><text class="tl-title" x="0" y="6">Made corporal at sea</text><text class="tl-detail" x="0" y="22">Inside a twenty-five day window; no day given</text></g><path class="tl-mark tl-unit" d="M126,1155.12 130.6,1159.72 126,1164.32 121.4,1159.72Z"/><path class="tl-tie" d="M133,1159.72 150,1159.72 150,1019.5 160,1019.5"/><g class="tl-row" transform="translate(168,1019.5)"><text class="tl-date" x="0" y="-11">25 Feb 1942</text><text class="tl-title" x="0" y="6">Ancon docks at Brisbane</text><text class="tl-detail" x="0" y="22">Arrived with no aeroplanes and a lieutenant commanding</text></g><path class="tl-mark tl-unit" d="M126,1155.12 130.6,1159.72 126,1164.32 121.4,1159.72Z"/><path class="tl-tie" d="M133,1159.72 150,1159.72 150,1073.5 160,1073.5"/><g class="tl-row" transform="translate(168,1073.5)"><text class="tl-date" x="0" y="-11">25 Feb 1942</text><text class="tl-title" x="0" y="6">Under canvas at Ascot</text><text class="tl-detail" x="0" y="22">"Some racetrack" — the Brisbane staging camp</text></g><path class="tl-mark tl-unit" d="M126,1189.68 130.6,1194.28 126,1198.88 121.4,1194.28Z"/><path class="tl-tie" d="M133,1194.28 150,1194.28 150,1127.5 160,1127.5"/><g class="tl-row" transform="translate(168,1127.5)"><text class="tl-date" x="0" y="-11">8 Mar 1942</text><text class="tl-title" x="0" y="6">Entrains for Charters Towers</text><text class="tl-detail" x="0" y="22">89th and 90th Squadrons go inland</text></g><path class="tl-mark tl-unit" d="M126,1194.82 130.6,1199.42 126,1204.02 121.4,1199.42Z"/><path class="tl-tie" d="M133,1199.42 150,1199.42 150,1181.5 160,1181.5"/><g class="tl-row" transform="translate(168,1181.5)"><text class="tl-date" x="0" y="-11">10 Mar 1942</text><text class="tl-title" x="0" y="6">Group at Charters Towers</text><text class="tl-detail" x="0" y="22">A strip begun 16 February; days old, not years</text></g><g class="tl-stick" transform="translate(92,261.833)"><path class="tl-stick-bar" d="M0,0 0,939.167"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,939.167 4,939.167"/><text class="tl-stick-label" x="8" y="473.583">one year</text></g><text class="pl-kicker" x="8" y="22">THE SERVICE YEARS · 2 of 4</text><text class="pl-title" x="8" y="48">Radio school to the Golden Gate</text><text class="pl-sub" x="8" y="66">21 entries between 19 Feb 1941 and 10 Mar 1942.</text></svg>