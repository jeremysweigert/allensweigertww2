<svg class="plate tlplate" viewBox="0 0 840 1164" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>The last thirty years, 1980–2012</title><desc>A vertical timeline. Years run down a rail at the left, to scale. Each event sits in a row to its right, joined to its moment on the rail by a bracket.</desc><path class="tl-rail" d="M126,78 126,1127"/><path class="tl-year-rule" d="M82,78 822,78"/><text class="tl-year" x="76" y="83" text-anchor="end">1980</text><path class="tl-year-rule" d="M82,236.939 822,236.939"/><text class="tl-year" x="76" y="241.939" text-anchor="end">1985</text><path class="tl-year-rule" d="M82,395.879 822,395.879"/><text class="tl-year" x="76" y="400.879" text-anchor="end">1990</text><path class="tl-year-rule" d="M82,554.818 822,554.818"/><text class="tl-year" x="76" y="559.818" text-anchor="end">1995</text><path class="tl-year-rule" d="M82,713.758 822,713.758"/><text class="tl-year" x="76" y="718.758" text-anchor="end">2000</text><path class="tl-year-rule" d="M82,872.697 822,872.697"/><text class="tl-year" x="76" y="877.697" text-anchor="end">2005</text><path class="tl-year-rule" d="M82,1031.64 822,1031.64"/><text class="tl-year" x="76" y="1036.64" text-anchor="end">2010</text><path class="tl-mark tl-press" d="M126,140.06 130.6,144.66 126,149.26 121.4,144.66Z"/><path class="tl-tie" d="M133,144.66 150,144.66 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">5 Feb 1982</text><text class="tl-title" x="0" y="6">Named to the cemetery committee</text><text class="tl-detail" x="0" y="22">Three-year term, by borough council</text></g><path class="tl-mark tl-family" d="M126,176.798 130.6,181.398 126,185.998 121.4,181.398Z"/><path class="tl-tie" d="M133,181.398 150,181.398 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">1983</text><text class="tl-title" x="0" y="6">Jessica is born</text><text class="tl-detail" x="0" y="22">Jessica M. Sweigert, Allen's granddaughter</text></g><path class="tl-mark tl-family tl-bar" d="M126,268.727 126,300.515"/><path class="tl-tie" d="M133,284.621 150,284.621 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">1986</text><text class="tl-title" x="0" y="6">Jeremy in his coat</text><text class="tl-detail" x="0" y="22">His grandson wearing the master sergeant's service coat</text></g><path class="tl-mark tl-press" d="M126,415.296 130.6,419.896 126,424.496 121.4,419.896Z"/><path class="tl-tie" d="M133,419.896 150,419.896 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">by 2 Oct 1990</text><text class="tl-title" x="0" y="6">At the borough council meeting</text><text class="tl-detail" x="0" y="22">Speaks as a resident about bicycle ramps behind St. Mark's</text></g><path class="tl-mark tl-family tl-bar" d="M126,671.374 126,991.902"/><path class="tl-tie" d="M133,831.638 150,831.638 150,325 160,325"/><g class="tl-row" transform="translate(168,325)"><text class="tl-date" x="0" y="-11">In his eighties</text><text class="tl-title" x="0" y="6">Walking a few miles a day</text><text class="tl-detail" x="0" y="22">His own routine, to keep in shape; by October 2005 the paper photographs</text><text class="tl-detail" x="0" y="37">him with a walker</text></g><path class="tl-mark tl-record" d="M126,849.43 130.6,854.03 126,858.63 121.4,854.03Z"/><path class="tl-tie" d="M133,854.03 150,854.03 150,386.5 160,386.5"/><g class="tl-row" transform="translate(168,386.5)"><text class="tl-date" x="0" y="-11">29 May 2004</text><text class="tl-title" x="0" y="6">Service to America certificate</text><text class="tl-detail" x="0" y="22">Post 286, marking the WWII Memorial dedication</text></g><path class="tl-mark tl-press tl-bar" d="M126,840.909 126,872.697"/><path class="tl-tie" d="M133,856.803 150,856.803 150,440.5 160,440.5"/><g class="tl-row" transform="translate(168,440.5)"><text class="tl-date" x="0" y="-11">about Jan 2004</text><text class="tl-title" x="0" y="6">Steps off the commission</text><text class="tl-detail" x="0" y="22">After what he called twenty years on it</text></g><path class="tl-mark tl-press" d="M126,859.417 130.6,864.017 126,868.617 121.4,864.017Z"/><path class="tl-tie" d="M133,864.017 150,864.017 150,494.5 160,494.5"/><g class="tl-row" transform="translate(168,494.5)"><text class="tl-date" x="0" y="-11">22 Sept 2004</text><text class="tl-title" x="0" y="6">Veterans' breakfast, River Inn</text><text class="tl-detail" x="0" y="22">At eighty-six, with Warren and Jean Frei</text></g><path class="tl-mark tl-family tl-bar" d="M126,745.545 126,991.902"/><path class="tl-tie" d="M133,868.723 150,868.723 150,548.5 160,548.5"/><g class="tl-row" transform="translate(168,548.5)"><text class="tl-date" x="0" y="-11">From 2001</text><text class="tl-title" x="0" y="6">Still holding hands in restaurants</text><text class="tl-detail" x="0" y="22">Fifty-seven years married, and out to dinner like that</text></g><path class="tl-mark tl-press" d="M126,893.332 130.6,897.932 126,902.532 121.4,897.932Z"/><path class="tl-tie" d="M133,897.932 150,897.932 150,602.5 160,602.5"/><g class="tl-row" transform="translate(168,602.5)"><text class="tl-date" x="0" y="-11">16 Oct 2005</text><text class="tl-title" x="0" y="6">Quoted on the cemetery</text><text class="tl-detail" x="0" y="22">At eighty-seven, on a walker, at an 1855 grave</text></g><path class="tl-mark tl-family tl-bar" d="M126,914.405 126,918.405"/><path class="tl-tie" d="M133,916.405 150,916.405 150,656.5 160,656.5"/><g class="tl-row" transform="translate(168,656.5)"><text class="tl-date" x="0" y="-11">Memorial Day 2006</text><text class="tl-title" x="0" y="6">Legion service, Cressona</text><text class="tl-detail" x="0" y="22">Photographed at Post 286's plaza observance</text></g><path class="tl-mark tl-family tl-bar" d="M126,919.703 126,923.703"/><path class="tl-tie" d="M133,921.703 150,921.703 150,710.5 160,710.5"/><g class="tl-row" transform="translate(168,710.5)"><text class="tl-date" x="0" y="-11">July 2006</text><text class="tl-title" x="0" y="6">The interview recorded</text><text class="tl-detail" x="0" y="22">Two tapes, about 101 minutes, in his own words</text></g><path class="tl-mark tl-press" d="M126,1081.93 130.6,1086.53 126,1091.13 121.4,1086.53Z"/><path class="tl-tie" d="M133,1086.53 150,1086.53 150,764.5 160,764.5"/><g class="tl-row" transform="translate(168,764.5)"><text class="tl-date" x="0" y="-11">About 22 September 2011</text><text class="tl-title" x="0" y="6">The flags taken from his porch</text><text class="tl-detail" x="0" y="22">An American flag and a Yankees flag; his last mention before the obituary</text></g><path class="tl-mark tl-press" d="M126,1082.63 130.6,1087.23 126,1091.83 121.4,1087.23Z"/><path class="tl-tie" d="M133,1087.23 150,1087.23 150,826 160,826"/><g class="tl-row" transform="translate(168,826)"><text class="tl-date" x="0" y="-11">30 September 2011</text><text class="tl-title" x="0" y="6">His son writes to the paper</text><text class="tl-detail" x="0" y="22">“Theft of flags is thoughtless act”; it confirms he built the house with</text><text class="tl-detail" x="0" y="37">his father</text></g><path class="tl-mark tl-family tl-bar" d="M126,1086.59 126,1090.59"/><path class="tl-tie" d="M133,1088.59 150,1088.59 150,887.5 160,887.5"/><g class="tl-row" transform="translate(168,887.5)"><text class="tl-date" x="0" y="-11">After the theft, 2011</text><text class="tl-title" x="0" y="6">A congressman sends a replacement flag</text><text class="tl-detail" x="0" y="22">Family testimony; no newspaper found reports it, and the date is not known</text></g><path class="tl-mark tl-family tl-bar" d="M126,1091.89 126,1095.89"/><path class="tl-tie" d="M133,1093.89 150,1093.89 150,941.5 160,941.5"/><g class="tl-row" transform="translate(168,941.5)"><text class="tl-date" x="0" y="-11">Dec 2011</text><text class="tl-title" x="0" y="6">The book given to him</text><text class="tl-detail" x="0" y="22">A Christmas gift; the family gathered for the holidays</text></g><path class="tl-mark tl-record" d="M126,1098.43 130.6,1103.03 126,1107.63 121.4,1103.03Z"/><path class="tl-tie" d="M133,1103.03 150,1103.03 150,995.5 160,995.5"/><g class="tl-row" transform="translate(168,995.5)"><text class="tl-date" x="0" y="-11">29 Mar 2012</text><text class="tl-title" x="0" y="6">Dies at ninety-three</text><text class="tl-detail" x="0" y="22">Schuylkill Medical Center; buried with military honours</text></g><path class="tl-mark tl-press" d="M126,1098.52 130.6,1103.12 126,1107.72 121.4,1103.12Z"/><path class="tl-tie" d="M133,1103.12 150,1103.12 150,1049.5 160,1049.5"/><g class="tl-row" transform="translate(168,1049.5)"><text class="tl-date" x="0" y="-11">30 Mar 2012</text><text class="tl-title" x="0" y="6">His obituary runs</text><text class="tl-detail" x="0" y="22">Republican &amp; Herald, Pottsville, over three days</text></g><path class="tl-mark tl-family tl-bar" d="M126,1095.21 126,1127"/><path class="tl-tie" d="M133,1111.11 150,1111.11 150,1103.5 160,1103.5"/><g class="tl-row" transform="translate(168,1103.5)"><text class="tl-date" x="0" y="-11">2012</text><text class="tl-title" x="0" y="6">The memorial film</text><text class="tl-detail" x="0" y="22">Made by his grandson from these photographs and tapes</text></g><g class="tl-stick" transform="translate(92,1059.42)"><path class="tl-stick-bar" d="M0,0 0,63.5758"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,63.5758 4,63.5758"/><text class="tl-stick-label" x="8" y="35.7879">two years</text></g><text class="pl-kicker" x="8" y="22">A LIFE IN BRIEF · 4 of 4</text><text class="pl-title" x="8" y="48">The last thirty years, 1980–2012</text><text class="pl-sub" x="8" y="66">19 entries. The rail at the left runs to scale; the rows do not, and a bracket joins each to its own moment.</text></svg>