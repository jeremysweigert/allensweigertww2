<svg class="plate tlplate" viewBox="0 0 840 1188" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>Guard, and the road to the Air Corps</title><desc>A vertical timeline of Allen Sweigert's service. Years run down a rail at the left, to scale; each event sits in a row to its right.</desc><path class="tl-rail" d="M126,78 126,1151"/><path class="tl-year-rule" d="M82,78 822,78"/><text class="tl-year" x="76" y="83" text-anchor="end">1936</text><path class="tl-year-rule" d="M82,292.6 822,292.6"/><text class="tl-year" x="76" y="297.6" text-anchor="end">1937</text><path class="tl-year-rule" d="M82,507.2 822,507.2"/><text class="tl-year" x="76" y="512.2" text-anchor="end">1938</text><path class="tl-year-rule" d="M82,721.8 822,721.8"/><text class="tl-year" x="76" y="726.8" text-anchor="end">1939</text><path class="tl-year-rule" d="M82,936.4 822,936.4"/><text class="tl-year" x="76" y="941.4" text-anchor="end">1940</text><path class="tl-year-rule" d="M82,1151 822,1151"/><text class="tl-year" x="76" y="1156" text-anchor="end">1941</text><path class="tl-mark tl-press" d="M126,168.699 130.6,173.299 126,177.899 121.4,173.299Z"/><path class="tl-tie" d="M133,173.299 150,173.299 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">10 June 1936</text><text class="tl-title" x="0" y="6">Wins the mathematics prize</text><text class="tl-detail" x="0" y="22">Cressona High School, at the thirty-fifth commencement</text></g><path class="tl-mark tl-press" d="M126,169.287 130.6,173.887 126,178.487 121.4,173.887Z"/><path class="tl-tie" d="M133,173.887 150,173.887 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">11 June 1936</text><text class="tl-title" x="0" y="6">Commencement, Cressona High</text><text class="tl-detail" x="0" y="22">The Alumni Association's mathematics prize; Eleanore Kulp valedictorian</text></g><path class="tl-mark tl-memory tl-bar" d="M126,78 126,292.6"/><path class="tl-tie" d="M133,185.3 150,185.3 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">late 1936</text><text class="tl-title tl-remembered" x="0" y="6">Enlists in the Guard</text><text class="tl-detail" x="0" y="22">For the drill pay, not for patriotism</text></g><path class="tl-mark tl-memory tl-bar" d="M126,78 126,292.6"/><path class="tl-tie" d="M133,185.3 150,185.3 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">spring 1936</text><text class="tl-title tl-remembered" x="0" y="6">Graduates Cressona High</text><text class="tl-detail" x="0" y="22">Into a coal county with no work in it</text></g><path class="tl-mark tl-press" d="M126,311.76 130.6,316.36 126,320.96 121.4,316.36Z"/><path class="tl-tie" d="M133,316.36 160,317.5"/><g class="tl-row" transform="translate(168,317.5)"><text class="tl-date" x="0" y="-11">10 February 1937</text><text class="tl-title" x="0" y="6">Pallbearer, Cressona Cemetery</text><text class="tl-detail" x="0" y="22">For Charles W. Hartman, retired railroader; Allen was eighteen</text></g><path class="tl-mark tl-press" d="M126,363.652 130.6,368.252 126,372.852 121.4,368.252Z"/><path class="tl-tie" d="M133,368.252 150,368.252 150,371.5 160,371.5"/><g class="tl-row" transform="translate(168,371.5)"><text class="tl-date" x="0" y="-11">7 May 1937</text><text class="tl-title" x="0" y="6">Gunner's examination, 98.5</text><text class="tl-detail" x="0" y="22">Listed with Headquarters Battery, 213th C.A.</text></g><path class="tl-mark tl-family tl-bar" d="M126,292.6 126,507.2"/><path class="tl-tie" d="M133,399.9 150,399.9 150,425.5 160,425.5"/><g class="tl-row" transform="translate(168,425.5)"><text class="tl-date" x="0" y="-11">1937</text><text class="tl-title" x="0" y="6">Inspection at Indiantown Gap</text><text class="tl-detail" x="0" y="22">Photographed at a Saturday inspection in camp</text></g><path class="tl-mark tl-press tl-bar" d="M126,399.9 126,417.783"/><path class="tl-tie" d="M133,408.842 150,408.842 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">July 1937</text><text class="tl-title" x="0" y="6">To camp with Headquarters Battery</text><text class="tl-detail" x="0" y="22">Named in the roster, with a Luther E. Sweigert beside him</text></g><path class="tl-mark tl-press" d="M126,490.021 130.6,494.621 126,499.221 121.4,494.621Z"/><path class="tl-tie" d="M133,494.621 150,494.621 150,533.5 160,533.5"/><g class="tl-row" transform="translate(168,533.5)"><text class="tl-date" x="0" y="-11">9 December 1937</text><text class="tl-title" x="0" y="6">Thanked at the football banquet</text><text class="tl-detail" x="0" y="22">With Wm. Hartman, for work done for the team; Emmet Rauch a manager</text></g><path class="tl-mark tl-memory tl-bar" d="M126,507.2 126,721.8"/><path class="tl-tie" d="M133,614.5 150,614.5 150,587.5 160,587.5"/><g class="tl-row" transform="translate(168,587.5)"><text class="tl-date" x="0" y="-11">about 1938–39</text><text class="tl-title tl-remembered" x="0" y="6">Courting Catherine begins</text><text class="tl-detail" x="0" y="22">His own estimate: "maybe 38, 39"</text></g><path class="tl-mark tl-press" d="M126,811.912 130.6,816.512 126,821.112 121.4,816.512Z"/><path class="tl-tie" d="M133,816.512 150,816.512 150,641.5 160,641.5"/><g class="tl-row" transform="translate(168,641.5)"><text class="tl-date" x="0" y="-11">9 June 1939</text><text class="tl-title" x="0" y="6">Speaks at the alumni banquet</text><text class="tl-detail" x="0" y="22">About ninety present; he introduced the senior class president</text></g><path class="tl-mark tl-press" d="M126,814.85 130.6,819.45 126,824.05 121.4,819.45Z"/><path class="tl-tie" d="M133,819.45 150,819.45 150,695.5 160,695.5"/><g class="tl-row" transform="translate(168,695.5)"><text class="tl-date" x="0" y="-11">14 June 1939</text><text class="tl-title" x="0" y="6">A doggie roast with Catherine</text><text class="tl-detail" x="0" y="22">Thirteen young people at the Scout Camp on the Blue Mountain</text></g><path class="tl-mark tl-press tl-bar" d="M126,846.983 126,864.867"/><path class="tl-tie" d="M133,855.925 150,855.925 150,749.5 160,749.5"/><g class="tl-row" transform="translate(168,749.5)"><text class="tl-date" x="0" y="-11">Early August 1939</text><text class="tl-title" x="0" y="6">Summer camp with the Guard</text><text class="tl-detail" x="0" y="22">Sixteen Cressona men named in the paper; the only dated pre-war camp</text></g><path class="tl-mark tl-press" d="M126,892.852 130.6,897.452 126,902.052 121.4,897.452Z"/><path class="tl-tie" d="M133,897.452 150,897.452 150,803.5 160,803.5"/><g class="tl-row" transform="translate(168,803.5)"><text class="tl-date" x="0" y="-11">25 October 1939</text><text class="tl-title" x="0" y="6">Scoutmaster of Troop 124</text><text class="tl-detail" x="0" y="22">A Hallowe'en party in the Evangelical Church basement, Cressona</text></g><path class="tl-mark tl-press" d="M126,1058.76 130.6,1063.36 126,1067.96 121.4,1063.36Z"/><path class="tl-tie" d="M133,1063.36 150,1063.36 150,857.5 160,857.5"/><g class="tl-row" transform="translate(168,857.5)"><text class="tl-date" x="0" y="-11">3 August 1940</text><text class="tl-title" x="0" y="6">Listed among the sergeants</text><text class="tl-detail" x="0" y="22">The battery by grade, six weeks before federal service</text></g><path class="tl-mark tl-unit" d="M126,1059.93 130.6,1064.53 126,1069.13 121.4,1064.53Z"/><path class="tl-tie" d="M133,1064.53 150,1064.53 150,911.5 160,911.5"/><g class="tl-row" transform="translate(168,911.5)"><text class="tl-date" x="0" y="-11">5–23 Aug 1940</text><text class="tl-title" x="0" y="6">New York manoeuvres</text><text class="tl-detail" x="0" y="22">Three weeks in the field, not the customary fifteen days</text></g><path class="tl-mark tl-unit" d="M126,1083.69 130.6,1088.29 126,1092.89 121.4,1088.29Z"/><path class="tl-tie" d="M133,1088.29 150,1088.29 150,965.5 160,965.5"/><g class="tl-row" transform="translate(168,965.5)"><text class="tl-date" x="0" y="-11">15 Sept 1940</text><text class="tl-title" x="0" y="6">Call-up reaches the regiment</text><text class="tl-detail" x="0" y="22">213th inducted at Allentown, by one regimental account</text></g><path class="tl-mark tl-press" d="M126,1084.28 130.6,1088.88 126,1093.48 121.4,1088.88Z"/><path class="tl-tie" d="M133,1088.88 150,1088.88 150,1019.5 160,1019.5"/><g class="tl-row" transform="translate(168,1019.5)"><text class="tl-date" x="0" y="-11">16 Sept 1940</text><text class="tl-title" x="0" y="6">Enters federal service</text><text class="tl-detail" x="0" y="22">At Pottsville with the 213th C.A. (A.A.)</text></g><path class="tl-mark tl-record" d="M126,1088.39 130.6,1092.99 126,1097.59 121.4,1092.99Z"/><path class="tl-tie" d="M133,1092.99 150,1092.99 150,1073.5 160,1073.5"/><g class="tl-row" transform="translate(168,1073.5)"><text class="tl-date" x="0" y="-11">23 Sept 1940</text><text class="tl-title" x="0" y="6">Service book opens</text><text class="tl-detail" x="0" y="22">His own hand starts Battery F at 9-23-40</text></g><path class="tl-mark tl-unit" d="M126,1088.98 130.6,1093.58 126,1098.18 121.4,1093.58Z"/><path class="tl-tie" d="M133,1093.58 150,1093.58 150,1127.5 160,1127.5"/><g class="tl-row" transform="translate(168,1127.5)"><text class="tl-date" x="0" y="-11">24 Sept 1940</text><text class="tl-title" x="0" y="6">Camp Pendleton, Virginia</text><text class="tl-detail" x="0" y="22">Regiment moves south for training</text></g><g class="tl-stick" transform="translate(92,932.4)"><path class="tl-stick-bar" d="M0,0 0,214.6"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,214.6 4,214.6"/><text class="tl-stick-label" x="8" y="111.3">one year</text></g><text class="pl-kicker" x="8" y="22">THE SERVICE YEARS · 1 of 4</text><text class="pl-title" x="8" y="48">Guard, and the road to the Air Corps</text><text class="pl-sub" x="8" y="66">20 entries between 10 June 1936 and 24 Sept 1940.</text></svg>