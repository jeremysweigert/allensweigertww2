s sixteen</text></g><path class="tl-mark tl-record tl-bar" d="M126,580.716 126,585.561"/><path class="tl-tie" d="M133,581.927 150,581.927 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">autumn 1934</text><text class="tl-title" x="0" y="6">Number 3, Cressona High</text><text class="tl-detail" x="0" y="22">six victories, two defeats; he had just turned sixteen</text></g><path class="tl-mark tl-press" d="M126,591.841 130.6,596.441 126,601.041 121.4,596.441Z"/><path class="tl-tie" d="M133,596.441 150,596.441 150,533.5 160,533.5"/><g class="tl-row" transform="translate(168,533.5)"><text class="tl-date" x="0" y="-11">May 1935</text><text class="tl-title" x="0" y="6">In the same room as Catherine</text><text class="tl-detail" x="0" y="22">the school banquet: he spoke, she served, his mother cooked</text></g><path class="tl-mark tl-press" d="M126,601.539 130.6,606.139 126,610.739 121.4,606.139Z"/><path class="tl-tie" d="M133,606.139 150,606.139 150,587.5 160,587.5"/><g class="tl-row" transform="translate(168,587.5)"><text class="tl-date" x="0" y="-11">18 October 1935</text><text class="tl-title" x="0" y="6">Literary editor, Press Club</text><text class="tl-detail" x="0" y="22">Cressona High School's new paper; Robert Dando was editor in chief</text></g><g class="tl-stick" transform="translate(92,558.545)"><path class="tl-stick-bar" d="M0,0 0,48.4545"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,48.4545 4,48.4545"/><text class="tl-stick-label" x="8" y="28.2273">two years</text></g><text class="pl-kicker" x="8" y="22">A LIFE IN BRIEF · 1 of 4</text><text class="pl-title" x="8" y="48">Before the uniform, 1914–1935</text><text class="pl-sub" x="8" y="66">10 entries. The rail at the left runs to scale; the rows do not, and a bracket joins each to its own moment.</text></svg>