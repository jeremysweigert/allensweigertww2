<svg class="plate tlplate" viewBox="0 0 840 1149" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>Australia and New Guinea</title><desc>A vertical timeline of Allen Sweigert's service. Years run down a rail at the left, to scale; each event sits in a row to its right.</desc><path class="tl-rail" d="M126,78 126,1112"/><path class="tl-year-rule" d="M82,537.556 822,537.556"/><text class="tl-year" x="76" y="542.556" text-anchor="end">1943</text><path class="tl-year-rule" d="M82,1112 822,1112"/><text class="tl-year" x="76" y="1117" text-anchor="end">1944</text><path class="tl-rank" d="M102,184.49 102,583.165 102,583.165"/><path class="tl-mark tl-unit" d="M126,103.707 130.6,108.307 126,112.907 121.4,108.307Z"/><path class="tl-tie" d="M133,108.307 150,108.307 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">1 Apr 1942</text><text class="tl-title" x="0" y="6">Collecting the Dutch B-25s</text><text class="tl-detail" x="0" y="22">Archerfield; orange triangles and Dutch handbooks</text></g><path class="tl-mark tl-unit" d="M126,135.162 130.6,139.762 126,144.362 121.4,139.762Z"/><path class="tl-tie" d="M133,139.762 150,139.762 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">21 Apr 1942</text><text class="tl-title" x="0" y="6">Bartle Frere crash</text><text class="tl-detail" x="0" y="22">A 90th Squadron B-25 into the mountain, seven killed</text></g><path class="tl-mark tl-memory tl-bar" d="M126,154.593 126,202.463"/><path class="tl-tie" d="M133,178.528 150,178.528 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">early May 1942</text><text class="tl-title tl-remembered" x="0" y="6">Standing by for Coral Sea</text><text class="tl-detail" x="0" y="22">Woken before dawn; three days beside a parked Mitchell</text></g><path class="tl-mark tl-letter" d="M126,179.89 130.6,184.49 126,189.09 121.4,184.49Z"/><path class="tl-tie" d="M133,184.49 150,184.49 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">by 19 May 1942</text><text class="tl-title" x="0" y="6">Promoted sergeant</text><text class="tl-detail" x="0" y="22">"Recently I was promoted to Sergeant"</text></g><path class="tl-mark tl-letter" d="M126,179.89 130.6,184.49 126,189.09 121.4,184.49Z"/><path class="tl-tie" d="M133,184.49 150,184.49 150,317.5 160,317.5"/><g class="tl-row" transform="translate(168,317.5)"><text class="tl-date" x="0" y="-11">19 May 1942</text><text class="tl-title" x="0" y="6">Writes home to The Call</text><text class="tl-detail" x="0" y="22">The only thing he wrote at the time</text></g><path class="tl-mark tl-press" d="M126,194.045 130.6,198.645 126,203.245 121.4,198.645Z"/><path class="tl-tie" d="M133,198.645 150,198.645 150,371.5 160,371.5"/><g class="tl-row" transform="translate(168,371.5)"><text class="tl-date" x="0" y="-11">28 May 1942</text><text class="tl-title" x="0" y="6">Promotion printed at Pottsville</text><text class="tl-detail" x="0" y="22">Cabled from Australia, set from his parents' news</text></g><path class="tl-mark tl-press" d="M126,216.756 130.6,221.356 126,225.956 121.4,221.356Z"/><path class="tl-tie" d="M133,221.356 150,221.356 150,425.5 160,425.5"/><g class="tl-row" transform="translate(168,425.5)"><text class="tl-date" x="0" y="-11">12 June 1942</text><text class="tl-title" x="0" y="6">His letter in print</text><text class="tl-detail" x="0" y="22">"Shots from Camp," page one, Schuylkill Haven</text></g><path class="tl-mark tl-press tl-bar" d="M126,347.989 126,491.6"/><path class="tl-tie" d="M133,365.222 150,365.222 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">southern spring 1942</text><text class="tl-title" x="0" y="6">Rockhampton, and his cousin</text><text class="tl-detail" x="0" y="22">Nose wheel gone; Pvt. Donald Berger found by ambulance markings</text></g><path class="tl-mark tl-record tl-bar" d="M126,441.815 126,489.685"/><path class="tl-tie" d="M133,465.75 150,465.75 150,541 160,541"/><g class="tl-row" transform="translate(168,541)"><text class="tl-date" x="0" y="-11">Nov 1942</text><text class="tl-title" x="0" y="6">A photo back dated 11/42</text><text class="tl-detail" x="0" y="22">Two comrades’ prints: one marked "N. G." and 11/42, one written "outside</text><text class="tl-detail" x="0" y="37">hut in New Guinea. Nov. 1942"</text></g><path class="tl-mark tl-unit" d="M126,576.992 130.6,581.592 126,586.192 121.4,581.592Z"/><path class="tl-tie" d="M133,581.592 150,581.592 150,602.5 160,602.5"/><g class="tl-row" transform="translate(168,602.5)"><text class="tl-date" x="0" y="-11">28 Jan 1943</text><text class="tl-title" x="0" y="6">Group to Port Moresby</text><text class="tl-detail" x="0" y="22">90th Squadron to 3-Mile Drome, Kila</text></g><path class="tl-mark tl-press" d="M126,578.565 130.6,583.165 126,587.765 121.4,583.165Z"/><path class="tl-tie" d="M133,583.165 150,583.165 150,656.5 160,656.5"/><g class="tl-row" transform="translate(168,656.5)"><text class="tl-date" x="0" y="-11">by 29 Jan 1943</text><text class="tl-title" x="0" y="6">Staff sergeant by now</text><text class="tl-detail" x="0" y="22">The paper sets his grade as staff sergeant</text></g><path class="tl-mark tl-press" d="M126,578.565 130.6,583.165 126,587.765 121.4,583.165Z"/><path class="tl-tie" d="M133,583.165 150,583.165 150,710.5 160,710.5"/><g class="tl-row" transform="translate(168,710.5)"><text class="tl-date" x="0" y="-11">29 Jan 1943</text><text class="tl-title" x="0" y="6">The story reaches home</text><text class="tl-detail" x="0" y="22">"It's A Small World!" — and it came out crooked</text></g><path class="tl-mark tl-unit" d="M126,633.422 130.6,638.022 126,642.622 121.4,638.022Z"/><path class="tl-tie" d="M133,638.022 150,638.022 150,764.5 160,764.5"/><g class="tl-row" transform="translate(168,764.5)"><text class="tl-date" x="0" y="-11">3 Mar 1943</text><text class="tl-title" x="0" y="6">Battle of the Bismarck Sea</text><text class="tl-detail" x="0" y="22">His squadron's strafers hit every ship in the convoy</text></g><path class="tl-mark tl-unit" d="M126,695.451 130.6,700.051 126,704.651 121.4,700.051Z"/><path class="tl-tie" d="M133,700.051 150,700.051 150,818.5 160,818.5"/><g class="tl-row" transform="translate(168,818.5)"><text class="tl-date" x="0" y="-11">12 Apr 1943</text><text class="tl-title" x="0" y="6">A hundred planes overhead</text><text class="tl-detail" x="0" y="22">Only raid near that size while he was at Moresby</text></g><path class="tl-mark tl-unit" d="M126,755.908 130.6,760.508 126,765.108 121.4,760.508Z"/><path class="tl-tie" d="M133,760.508 150,760.508 150,872.5 160,872.5"/><g class="tl-row" transform="translate(168,872.5)"><text class="tl-date" x="0" y="-11">20 May 1943</text><text class="tl-title" x="0" y="6">Forward to Dobodura</text><text class="tl-detail" x="0" y="22">Group 20 May, the 90th Squadron logged 21 May</text></g><path class="tl-mark tl-family tl-bar" d="M126,537.556 126,1112"/><path class="tl-tie" d="M133,824.778 150,824.778 150,926.5 160,926.5"/><g class="tl-row" transform="translate(168,926.5)"><text class="tl-date" x="0" y="-11">1943</text><text class="tl-title" x="0" y="6">Roll of Honor dedicated</text><text class="tl-detail" x="0" y="22">Cressona names its serving men and women</text></g><path class="tl-mark tl-record" d="M126,871.221 130.6,875.821 126,880.421 121.4,875.821Z"/><path class="tl-tie" d="M133,875.821 150,875.821 150,980.5 160,980.5"/><g class="tl-row" transform="translate(168,980.5)"><text class="tl-date" x="0" y="-11">2 Aug 1943</text><text class="tl-title" x="0" y="6">Good Conduct Medal</text><text class="tl-detail" x="0" y="22">General Order 3, Headquarters 3d Attack Group</text></g><path class="tl-mark tl-unit" d="M126,894.812 130.6,899.412 126,904.012 121.4,899.412Z"/><path class="tl-tie" d="M133,899.412 150,899.412 150,1034.5 160,1034.5"/><g class="tl-row" transform="translate(168,1034.5)"><text class="tl-date" x="0" y="-11">17 Aug 1943</text><text class="tl-title" x="0" y="6">The Wewak strike</text><text class="tl-detail" x="0" y="22">Earned the group a Distinguished Unit Citation</text></g><path class="tl-mark tl-memory" d="M126,1097.32 130.6,1101.92 126,1106.52 121.4,1101.92Z"/><path class="tl-tie" d="M133,1101.92 150,1101.92 150,1088.5 160,1088.5"/><g class="tl-row" transform="translate(168,1088.5)"><text class="tl-date" x="0" y="-11">Christmas Eve 1943</text><text class="tl-title tl-remembered" x="0" y="6">The scorpion in the bag</text><text class="tl-detail" x="0" y="22">A shot from the medics, then the pictures anyway</text></g><g class="tl-stick" transform="translate(92,533.556)"><path class="tl-stick-bar" d="M0,0 0,574.444"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,574.444 4,574.444"/><text class="tl-stick-label" x="8" y="291.222">one year</text></g><text class="pl-kicker" x="8" y="22">THE SERVICE YEARS · 3 of 4</text><text class="pl-title" x="8" y="48">Australia and New Guinea</text><text class="pl-sub" x="8" y="66">19 entries between 1 Apr 1942 and Christmas Eve 1943.</text></svg>