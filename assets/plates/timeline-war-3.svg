<svg class="plate tlplate" viewBox="0 0 840 1257" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>Australia and New Guinea</title><desc>A vertical timeline of Allen Sweigert's service. Years run down a rail at the left, to scale; each event sits in a row to its right.</desc><path class="tl-rail" d="M126,78 126,1220"/><path class="tl-year-rule" d="M82,585.556 822,585.556"/><text class="tl-year" x="76" y="590.556" text-anchor="end">1943</text><path class="tl-year-rule" d="M82,1220 822,1220"/><text class="tl-year" x="76" y="1225" text-anchor="end">1944</text><path class="tl-rank" d="M102,195.613 102,635.929 102,635.929"/><path class="tl-mark tl-unit" d="M126,106.872 130.6,111.472 126,116.072 121.4,111.472Z"/><path class="tl-tie" d="M133,111.472 150,111.472 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">1 Apr 1942</text><text class="tl-title" x="0" y="6">Collecting the Dutch B-25s</text><text class="tl-detail" x="0" y="22">Archerfield; orange triangles and Dutch handbooks</text></g><path class="tl-mark tl-unit" d="M126,141.613 130.6,146.213 126,150.813 121.4,146.213Z"/><path class="tl-tie" d="M133,146.213 150,146.213 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">21 Apr 1942</text><text class="tl-title" x="0" y="6">Bartle Frere crash</text><text class="tl-detail" x="0" y="22">A 90th Squadron B-25 into the mountain, seven killed</text></g><path class="tl-mark tl-memory tl-bar" d="M126,162.593 126,215.463"/><path class="tl-tie" d="M133,189.028 150,189.028 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">early May 1942</text><text class="tl-title tl-remembered" x="0" y="6">Standing by for Coral Sea</text><text class="tl-detail" x="0" y="22">Woken before dawn; three days beside a parked Mitchell</text></g><path class="tl-mark tl-letter" d="M126,191.013 130.6,195.613 126,200.213 121.4,195.613Z"/><path class="tl-tie" d="M133,195.613 150,195.613 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">by 19 May 1942</text><text class="tl-title" x="0" y="6">Promoted sergeant</text><text class="tl-detail" x="0" y="22">"Recently I was promoted to Sergeant"</text></g><path class="tl-mark tl-letter" d="M126,191.013 130.6,195.613 126,200.213 121.4,195.613Z"/><path class="tl-tie" d="M133,195.613 150,195.613 150,317.5 160,317.5"/><g class="tl-row" transform="translate(168,317.5)"><text class="tl-date" x="0" y="-11">19 May 1942</text><text class="tl-title" x="0" y="6">Writes home to The Call</text><text class="tl-detail" x="0" y="22">The only thing he wrote at the time</text></g><path class="tl-mark tl-press" d="M126,206.646 130.6,211.246 126,215.846 121.4,211.246Z"/><path class="tl-tie" d="M133,211.246 150,211.246 150,371.5 160,371.5"/><g class="tl-row" transform="translate(168,371.5)"><text class="tl-date" x="0" y="-11">28 May 1942</text><text class="tl-title" x="0" y="6">Promotion printed at Pottsville</text><text class="tl-detail" x="0" y="22">Cabled from Australia, set from his parents' news</text></g><path class="tl-mark tl-press" d="M126,231.729 130.6,236.329 126,240.929 121.4,236.329Z"/><path class="tl-tie" d="M133,236.329 150,236.329 150,425.5 160,425.5"/><g class="tl-row" transform="translate(168,425.5)"><text class="tl-date" x="0" y="-11">12 June 1942</text><text class="tl-title" x="0" y="6">His letter in print</text><text class="tl-detail" x="0" y="22">"Shots from Camp," page one, Schuylkill Haven</text></g><path class="tl-mark tl-press tl-bar" d="M126,376.189 126,534.8"/><path class="tl-tie" d="M133,395.222 150,395.222 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">southern spring 1942</text><text class="tl-title" x="0" y="6">Rockhampton, and his cousin</text><text class="tl-detail" x="0" y="22">Nose wheel gone; Pvt. Donald Berger found by ambulance markings</text></g><path class="tl-mark tl-record tl-bar" d="M126,479.815 126,532.685"/><path class="tl-tie" d="M133,506.25 150,506.25 150,541 160,541"/><g class="tl-row" transform="translate(168,541)"><text class="tl-date" x="0" y="-11">Nov 1942</text><text class="tl-title" x="0" y="6">A photo back dated 11/42</text><text class="tl-detail" x="0" y="22">Two comrades’ prints: one marked "N. G." and 11/42, one written "outside</text><text class="tl-detail" x="0" y="37">hut in New Guinea. Nov. 1942"</text></g><path class="tl-mark tl-unit" d="M126,554.188 130.6,558.788 126,563.388 121.4,558.788Z"/><path class="tl-tie" d="M133,558.788 150,558.788 150,602.5 160,602.5"/><g class="tl-row" transform="translate(168,602.5)"><text class="tl-date" x="0" y="-11">15 Dec 1942</text><text class="tl-title" x="0" y="6">41-13091 lost on the way home</text><text class="tl-detail" x="0" y="22">Found on the Kirrama Range in July 1943; eleven dead</text></g><path class="tl-mark tl-unit" d="M126,562.873 130.6,567.473 126,572.073 121.4,567.473Z"/><path class="tl-tie" d="M133,567.473 150,567.473 150,656.5 160,656.5"/><g class="tl-row" transform="translate(168,656.5)"><text class="tl-date" x="0" y="-11">20 Dec 1942</text><text class="tl-title" x="0" y="6">41-29706 into the Coral Sea</text><text class="tl-detail" x="0" y="22">North of Osprey Reef in bad weather; none recovered</text></g><path class="tl-mark tl-unit" d="M126,629.592 130.6,634.192 126,638.792 121.4,634.192Z"/><path class="tl-tie" d="M133,634.192 150,634.192 150,710.5 160,710.5"/><g class="tl-row" transform="translate(168,710.5)"><text class="tl-date" x="0" y="-11">28 Jan 1943</text><text class="tl-title" x="0" y="6">Group to Port Moresby</text><text class="tl-detail" x="0" y="22">90th Squadron to 3-Mile Drome, Kila</text></g><path class="tl-mark tl-press" d="M126,631.329 130.6,635.929 126,640.529 121.4,635.929Z"/><path class="tl-tie" d="M133,635.929 150,635.929 150,764.5 160,764.5"/><g class="tl-row" transform="translate(168,764.5)"><text class="tl-date" x="0" y="-11">by 29 Jan 1943</text><text class="tl-title" x="0" y="6">Staff sergeant by now</text><text class="tl-detail" x="0" y="22">The paper sets his grade as staff sergeant</text></g><path class="tl-mark tl-press" d="M126,631.329 130.6,635.929 126,640.529 121.4,635.929Z"/><path class="tl-tie" d="M133,635.929 150,635.929 150,818.5 160,818.5"/><g class="tl-row" transform="translate(168,818.5)"><text class="tl-date" x="0" y="-11">29 Jan 1943</text><text class="tl-title" x="0" y="6">The story reaches home</text><text class="tl-detail" x="0" y="22">"It's A Small World!" — and it came out crooked</text></g><path class="tl-mark tl-unit" d="M126,691.916 130.6,696.516 126,701.116 121.4,696.516Z"/><path class="tl-tie" d="M133,696.516 150,696.516 150,872.5 160,872.5"/><g class="tl-row" transform="translate(168,872.5)"><text class="tl-date" x="0" y="-11">3 Mar 1943</text><text class="tl-title" x="0" y="6">Battle of the Bismarck Sea</text><text class="tl-detail" x="0" y="22">His squadron's strafers hit every ship in the convoy</text></g><path class="tl-mark tl-unit" d="M126,760.424 130.6,765.024 126,769.624 121.4,765.024Z"/><path class="tl-tie" d="M133,765.024 150,765.024 150,926.5 160,926.5"/><g class="tl-row" transform="translate(168,926.5)"><text class="tl-date" x="0" y="-11">12 Apr 1943</text><text class="tl-title" x="0" y="6">A hundred planes overhead</text><text class="tl-detail" x="0" y="22">Only raid near that size while he was at Moresby</text></g><path class="tl-mark tl-unit" d="M126,827.195 130.6,831.795 126,836.395 121.4,831.795Z"/><path class="tl-tie" d="M133,831.795 150,831.795 150,980.5 160,980.5"/><g class="tl-row" transform="translate(168,980.5)"><text class="tl-date" x="0" y="-11">20 May 1943</text><text class="tl-title" x="0" y="6">Forward to Dobodura</text><text class="tl-detail" x="0" y="22">Group 20 May, the 90th Squadron logged 21 May</text></g><path class="tl-mark tl-family tl-bar" d="M126,585.556 126,1220"/><path class="tl-tie" d="M133,902.778 150,902.778 150,1034.5 160,1034.5"/><g class="tl-row" transform="translate(168,1034.5)"><text class="tl-date" x="0" y="-11">1943</text><text class="tl-title" x="0" y="6">Roll of Honor dedicated</text><text class="tl-detail" x="0" y="22">Cressona names its serving men and women</text></g><path class="tl-mark tl-record" d="M126,954.553 130.6,959.153 126,963.753 121.4,959.153Z"/><path class="tl-tie" d="M133,959.153 150,959.153 150,1088.5 160,1088.5"/><g class="tl-row" transform="translate(168,1088.5)"><text class="tl-date" x="0" y="-11">2 Aug 1943</text><text class="tl-title" x="0" y="6">Good Conduct Medal</text><text class="tl-detail" x="0" y="22">General Order 3, Headquarters 3d Attack Group</text></g><path class="tl-mark tl-unit" d="M126,980.608 130.6,985.208 126,989.808 121.4,985.208Z"/><path class="tl-tie" d="M133,985.208 150,985.208 150,1142.5 160,1142.5"/><g class="tl-row" transform="translate(168,1142.5)"><text class="tl-date" x="0" y="-11">17 Aug 1943</text><text class="tl-title" x="0" y="6">The Wewak strike</text><text class="tl-detail" x="0" y="22">Earned the group a Distinguished Unit Citation</text></g><path class="tl-mark tl-memory" d="M126,1204.27 130.6,1208.87 126,1213.47 121.4,1208.87Z"/><path class="tl-tie" d="M133,1208.87 150,1208.87 150,1196.5 160,1196.5"/><g class="tl-row" transform="translate(168,1196.5)"><text class="tl-date" x="0" y="-11">Christmas Eve 1943</text><text class="tl-title tl-remembered" x="0" y="6">The scorpion in the bag</text><text class="tl-detail" x="0" y="22">A shot from the medics, then the pictures anyway</text></g><g class="tl-stick" transform="translate(92,581.556)"><path class="tl-stick-bar" d="M0,0 0,634.444"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,634.444 4,634.444"/><text class="tl-stick-label" x="8" y="321.222">one year</text></g><text class="pl-kicker" x="8" y="22">THE SERVICE YEARS · 3 of 4</text><text class="pl-title" x="8" y="48">Australia and New Guinea</text><text class="pl-sub" x="8" y="66">21 entries between 1 Apr 1942 and Christmas Eve 1943.</text></svg>