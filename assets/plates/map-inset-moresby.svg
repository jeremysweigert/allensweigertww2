<svg class="plate mapplate inset" viewBox="0 0 560 458.1" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>The Port Moresby fields, and which one is not settled</title><desc>An inset of the airfields around Port Moresby. 17-Mile Drome, also called Durand, and 3-Mile Drome, also called Kila Kila, lie about five units apart at the scale of the New Guinea map. Both are drawn and neither is chosen: the record does not settle which of them he was on.</desc><rect class="map-sea" x="0" y="0" width="560" height="458.1"/><path class="map-land" d="M644,-68.715 644,526.815 549.906,526.815 543,517.6 419.8,408.7 155.2,233.1 101.9,189.4 -1.8,28.5 3.30219,-68.715Z"/><rect class="map-frame" x=".5" y=".5" width="559" height="457.1"/><g class="pl" transform="translate(251.1,293.5)"><circle class="mk-him" r="6"/><path class="pl-lead" d="M-8,0 -4,15 -11,15"/><text class="pl-name" x="-13" y="20" text-anchor="end">Port Moresby</text><text class="pl-date" x="-13" y="39" text-anchor="end">the town</text></g><g class="pl" transform="translate(278.1,183.4)"><circle class="mk-him" r="6"/><path class="pl-lead" d="M8,0 4,-17 11,-17"/><text class="pl-name" x="13" y="-12" text-anchor="start">17-Mile Drome</text><text class="pl-date" x="13" y="7" text-anchor="start">his account names it</text></g><g class="pl" transform="translate(299.2,306.6)"><rect class="mk-sqn" x="-5.5" y="-5.5" width="11" height="11"/><path class="mk-sqn-tick" d="M-5.5,-5.5 5.5,5.5"/><path class="pl-lead" d="M8,0 4,15 11,15"/><text class="pl-name" x="13" y="20" text-anchor="start">3-Mile Drome</text><text class="pl-date" x="13" y="39" text-anchor="start">the 90th, 28 Jan 1943</text></g><text class="map-caveat" x="26" y="446.1">Both fields are drawn and neither is chosen. Which of them he was on is not settled by anything in this collection.</text><g class="sc" transform="translate(431.2,412.1)"><path class="sc-bar" d="M0,0 102.8,0"/><path class="sc-bar" d="M0,-4 0,4"/><path class="sc-bar" d="M102.8,-4 102.8,4"/><text class="sc-label" x="51.4" y="-8" text-anchor="middle">10 km</text></g><text class="pl-kicker" x="26" y="20">INSET</text><text class="pl-title" x="26" y="46">The Port Moresby fields</text></svg>