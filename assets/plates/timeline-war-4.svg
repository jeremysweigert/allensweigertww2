<svg class="plate tlplate" viewBox="0 0 840 1350" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>Home, and out</title><desc>A vertical timeline of Allen Sweigert's service. Years run down a rail at the left, to scale; each event sits in a row to its right.</desc><path class="tl-rail" d="M126,78 126,1313"/><path class="tl-year-rule" d="M82,78 822,78"/><text class="tl-year" x="76" y="83" text-anchor="end">1944</text><path class="tl-year-rule" d="M82,639.364 822,639.364"/><text class="tl-year" x="76" y="644.364" text-anchor="end">1945</text><path class="tl-year-rule" d="M82,1200.73 822,1200.73"/><text class="tl-year" x="76" y="1205.73" text-anchor="end">1946</text><path class="tl-mark tl-unit" d="M126,119.508 130.6,124.108 126,128.708 121.4,124.108Z"/><path class="tl-tie" d="M133,124.108 150,124.108 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">30 Jan 1944</text><text class="tl-title" x="0" y="6">90th Squadron to Nadzab</text><text class="tl-detail" x="0" y="22">Group headquarters followed on 3 February</text></g><path class="tl-mark tl-record" d="M126,205.392 130.6,209.992 126,214.592 121.4,209.992Z"/><path class="tl-tie" d="M133,209.992 150,209.992 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">25 Mar 1944</text><text class="tl-title" x="0" y="6">Distinguished Unit Badge</text><text class="tl-detail" x="0" y="22">General Order 3, Headquarters 3d Attack Group</text></g><path class="tl-mark tl-unit" d="M126,238.343 130.6,242.943 126,247.543 121.4,242.943Z"/><path class="tl-tie" d="M133,242.943 150,242.943 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">16 Apr 1944</text><text class="tl-title" x="0" y="6">Black Sunday at Nadzab</text><text class="tl-detail" x="0" y="22">Thirty-seven aircraft lost to weather, none to the enemy</text></g><path class="tl-mark tl-unit" d="M126,278.98 130.6,283.58 126,288.18 121.4,283.58Z"/><path class="tl-tie" d="M133,283.58 150,283.58 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">12 May 1944</text><text class="tl-title" x="0" y="6">Ashore at Hollandia</text><text class="tl-detail" x="0" y="22">Waded in behind the LSTs; prisoners marched past</text></g><path class="tl-mark tl-memory tl-bar" d="M126,313.773 126,454.114"/><path class="tl-tie" d="M133,386.75 150,386.75 150,317.5 160,317.5"/><g class="tl-row" transform="translate(168,317.5)"><text class="tl-date" x="0" y="-11">summer 1944</text><text class="tl-title tl-remembered" x="0" y="6">The Bob Hope show</text><text class="tl-detail" x="0" y="22">He drew the lucky half of the crew</text></g><path class="tl-mark tl-memory" d="M126,461.506 130.6,466.106 126,470.706 121.4,466.106Z"/><path class="tl-tie" d="M133,466.106 150,466.106 150,371.5 160,371.5"/><g class="tl-row" transform="translate(168,371.5)"><text class="tl-date" x="0" y="-11">9 Sept 1944</text><text class="tl-title tl-remembered" x="0" y="6">Word on his birthday</text><text class="tl-detail" x="0" y="22">Back from the hill movie to shouting in camp</text></g><path class="tl-mark tl-record" d="M126,463.042 130.6,467.642 126,472.242 121.4,467.642Z"/><path class="tl-tie" d="M133,467.642 150,467.642 150,425.5 160,425.5"/><g class="tl-row" transform="translate(168,425.5)"><text class="tl-date" x="0" y="-11">10 Sept 1944</text><text class="tl-title" x="0" y="6">Service book closes overseas</text><text class="tl-detail" x="0" y="22">His own hand ends the 90th Squadron at 9-10-44</text></g><path class="tl-mark tl-record" d="M126,492.244 130.6,496.844 126,501.444 121.4,496.844Z"/><path class="tl-tie" d="M133,496.844 150,496.844 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">29 Sept 1944</text><text class="tl-title" x="0" y="6">Foreign service ends</text><text class="tl-detail" x="0" y="22">Two years, seven months, twenty-nine days abroad</text></g><path class="tl-mark tl-memory" d="M126,505.216 130.6,509.816 126,514.416 121.4,509.816Z"/><path class="tl-tie" d="M133,509.816 150,509.816 150,533.5 160,533.5"/><g class="tl-row" transform="translate(168,533.5)"><text class="tl-date" x="0" y="-11">7 Oct 1944</text><text class="tl-title tl-remembered" x="0" y="6">Home to Cressona</text><text class="tl-detail" x="0" y="22">Back porch, the light on, and the dog</text></g><path class="tl-mark tl-record" d="M126,515.974 130.6,520.574 126,525.174 121.4,520.574Z"/><path class="tl-tie" d="M133,520.574 150,520.574 150,587.5 160,587.5"/><g class="tl-row" transform="translate(168,587.5)"><text class="tl-date" x="0" y="-11">14 Oct 1944</text><text class="tl-title" x="0" y="6">Marries Catherine Kline</text><text class="tl-detail" x="0" y="22">Two o'clock, St. Mark's; Rev. Mark G. Wagner</text></g><path class="tl-mark tl-press" d="M126,515.974 130.6,520.574 126,525.174 121.4,520.574Z"/><path class="tl-tie" d="M133,520.574 150,520.574 150,641.5 160,641.5"/><g class="tl-row" transform="translate(168,641.5)"><text class="tl-date" x="0" y="-11">by 14 Oct 1944</text><text class="tl-title" x="0" y="6">Master sergeant by now</text><text class="tl-detail" x="0" y="22">Chevrons on his sleeve in the wedding portrait</text></g><path class="tl-mark tl-memory tl-bar" d="M126,499.023 126,545.803"/><path class="tl-tie" d="M133,522.413 150,522.413 150,695.5 160,695.5"/><g class="tl-row" transform="translate(168,695.5)"><text class="tl-date" x="0" y="-11">Oct 1944</text><text class="tl-title tl-remembered" x="0" y="6">Twenty-one day delay</text><text class="tl-detail" x="0" y="22">A week's honeymoon by car, then reassignment</text></g><path class="tl-mark tl-press" d="M126,525.196 130.6,529.796 126,534.396 121.4,529.796Z"/><path class="tl-tie" d="M133,529.796 150,529.796 150,749.5 160,749.5"/><g class="tl-row" transform="translate(168,749.5)"><text class="tl-date" x="0" y="-11">20 Oct 1944</text><text class="tl-title" x="0" y="6">The wedding notice prints</text><text class="tl-detail" x="0" y="22">Both portraits, and thirty-two months overseas</text></g><path class="tl-mark tl-memory tl-bar" d="M126,545.803 126,592.583"/><path class="tl-tie" d="M133,569.193 150,569.193 150,803.5 160,803.5"/><g class="tl-row" transform="translate(168,803.5)"><text class="tl-date" x="0" y="-11">Nov 1944</text><text class="tl-title tl-remembered" x="0" y="6">Atlantic City redistribution</text><text class="tl-detail" x="0" y="22">Refused two grades to stay; posted to DeRidder</text></g><path class="tl-mark tl-record" d="M126,565.832 130.6,570.432 126,575.032 121.4,570.432Z"/><path class="tl-tie" d="M133,570.432 150,570.432 150,857.5 160,857.5"/><g class="tl-row" transform="translate(168,857.5)"><text class="tl-date" x="0" y="-11">16 Nov 1944</text><text class="tl-title" x="0" y="6">Joins the 399th</text><text class="tl-detail" x="0" y="22">399th Fighter Squadron, DeRidder Army Air Base</text></g><path class="tl-mark tl-unit" d="M126,693.843 130.6,698.443 126,703.043 121.4,698.443Z"/><path class="tl-tie" d="M133,698.443 150,698.443 150,911.5 160,911.5"/><g class="tl-row" transform="translate(168,911.5)"><text class="tl-date" x="0" y="-11">8 Feb 1945</text><text class="tl-title" x="0" y="6">Misses the move by a day</text><text class="tl-detail" x="0" y="22">In hospital with malaria; group left for Stuttgart</text></g><path class="tl-mark tl-record" d="M126,864.934 130.6,869.534 126,874.134 121.4,869.534Z"/><path class="tl-tie" d="M133,869.534 150,869.534 150,965.5 160,965.5"/><g class="tl-row" transform="translate(168,965.5)"><text class="tl-date" x="0" y="-11">28 May 1945</text><text class="tl-title" x="0" y="6">Leaves the 399th</text><text class="tl-detail" x="0" y="22">His service book closes the squadron at 5-28-45</text></g><path class="tl-mark tl-memory" d="M126,868.008 130.6,872.608 126,877.208 121.4,872.608Z"/><path class="tl-tie" d="M133,872.608 150,872.608 150,1019.5 160,1019.5"/><g class="tl-row" transform="translate(168,1019.5)"><text class="tl-date" x="0" y="-11">late May 1945</text><text class="tl-title tl-remembered" x="0" y="6">Told he is going out</text><text class="tl-detail" x="0" y="22">His own date: "May the 30th or in June"</text></g><path class="tl-mark tl-record" d="M126,880.98 130.6,885.58 126,890.18 121.4,885.58Z"/><path class="tl-tie" d="M133,885.58 150,885.58 150,1073.5 160,1073.5"/><g class="tl-row" transform="translate(168,1073.5)"><text class="tl-date" x="0" y="-11">8 June 1945</text><text class="tl-title" x="0" y="6">Separated at Fort Dix</text><text class="tl-detail" x="0" y="22">Three hundred dollars and $42.20 travel pay</text></g><path class="tl-mark tl-memory tl-bar" d="M126,873.265 126,920.045"/><path class="tl-tie" d="M133,896.655 150,896.655 150,1127.5 160,1127.5"/><g class="tl-row" transform="translate(168,1127.5)"><text class="tl-date" x="0" y="-11">summer 1945</text><text class="tl-title tl-remembered" x="0" y="6">A fortnight at the depot</text><text class="tl-detail" x="0" y="22">Sorting material shipped home from the war zones</text></g><path class="tl-mark tl-family tl-bar" d="M126,639.364 126,1200.73"/><path class="tl-tie" d="M133,920.045 150,920.045 150,1181.5 160,1181.5"/><g class="tl-row" transform="translate(168,1181.5)"><text class="tl-date" x="0" y="-11">1945</text><text class="tl-title" x="0" y="6">Chicago with his father</text><text class="tl-detail" x="0" y="22">Photographed on a street while at Coyne</text></g><path class="tl-mark tl-memory tl-bar" d="M126,1015.48 126,1155.82"/><path class="tl-tie" d="M133,1032.32 150,1032.32 150,1235.5 160,1235.5"/><g class="tl-row" transform="translate(168,1235.5)"><text class="tl-date" x="0" y="-11">spring 1945</text><text class="tl-title tl-remembered" x="0" y="6">Malaria again, Stuttgart</text><text class="tl-detail" x="0" y="22">A second hospital stay in Arkansas</text></g><path class="tl-mark tl-record tl-bar" d="M126,1200.73 126,1247.51"/><path class="tl-tie" d="M133,1224.12 150,1224.12 150,1289.5 160,1289.5"/><g class="tl-row" transform="translate(168,1289.5)"><text class="tl-date" x="0" y="-11">Jan 1946</text><text class="tl-title" x="0" y="6">Graduates Coyne, Chicago</text><text class="tl-detail" x="0" y="22">91.3 in electricity, 94.5 in radio-electronics</text></g><g class="tl-stick" transform="translate(92,747.636)"><path class="tl-stick-bar" d="M0,0 0,561.364"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,561.364 4,561.364"/><text class="tl-stick-label" x="8" y="284.682">one year</text></g><text class="pl-kicker" x="8" y="22">THE SERVICE YEARS · 4 of 4</text><text class="pl-title" x="8" y="48">Home, and out</text><text class="pl-sub" x="8" y="66">23 entries between 30 Jan 1944 and Jan 1946.</text></svg>