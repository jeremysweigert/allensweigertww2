<svg class="plate tlplate" viewBox="0 0 840 1782" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>Home, and out</title><desc>A vertical timeline of Allen Sweigert's service. Years run down a rail at the left, to scale; each event sits in a row to its right.</desc><path class="tl-rail" d="M126,78 126,1745"/><path class="tl-year-rule" d="M82,78 822,78"/><text class="tl-year" x="76" y="83" text-anchor="end">1944</text><path class="tl-year-rule" d="M82,835.727 822,835.727"/><text class="tl-year" x="76" y="840.727" text-anchor="end">1945</text><path class="tl-year-rule" d="M82,1593.45 822,1593.45"/><text class="tl-year" x="76" y="1598.45" text-anchor="end">1946</text><path class="tl-mark tl-unit" d="M126,135.636 130.6,140.236 126,144.836 121.4,140.236Z"/><path class="tl-tie" d="M133,140.236 150,140.236 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">30 Jan 1944</text><text class="tl-title" x="0" y="6">90th Squadron to Nadzab</text><text class="tl-detail" x="0" y="22">Group headquarters followed on 3 February</text></g><path class="tl-mark tl-record" d="M126,251.562 130.6,256.162 126,260.762 121.4,256.162Z"/><path class="tl-tie" d="M133,256.162 150,256.162 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">25 Mar 1944</text><text class="tl-title" x="0" y="6">Distinguished Unit Badge</text><text class="tl-detail" x="0" y="22">General Order 3, Headquarters 3d Attack Group</text></g><path class="tl-mark tl-unit" d="M126,296.04 130.6,300.64 126,305.24 121.4,300.64Z"/><path class="tl-tie" d="M133,300.64 150,300.64 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">16 Apr 1944</text><text class="tl-title" x="0" y="6">Black Sunday at Nadzab</text><text class="tl-detail" x="0" y="22">Thirty-seven aircraft lost to weather, none to the enemy</text></g><path class="tl-mark tl-unit" d="M126,350.891 130.6,355.491 126,360.091 121.4,355.491Z"/><path class="tl-tie" d="M133,355.491 150,355.491 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">12 May 1944</text><text class="tl-title" x="0" y="6">Ashore at Hollandia</text><text class="tl-detail" x="0" y="22">Waded in behind the LSTs; prisoners marched past</text></g><path class="tl-mark tl-memory tl-bar" d="M126,396.245 126,585.677"/><path class="tl-tie" d="M133,494.75 150,494.75 150,317.5 160,317.5"/><g class="tl-row" transform="translate(168,317.5)"><text class="tl-date" x="0" y="-11">summer 1944</text><text class="tl-title tl-remembered" x="0" y="6">The Bob Hope show</text><text class="tl-detail" x="0" y="22">He drew the lucky half of the crew</text></g><path class="tl-mark tl-memory" d="M126,597.264 130.6,601.864 126,606.464 121.4,601.864Z"/><path class="tl-tie" d="M133,601.864 150,601.864 150,371.5 160,371.5"/><g class="tl-row" transform="translate(168,371.5)"><text class="tl-date" x="0" y="-11">9 Sept 1944</text><text class="tl-title tl-remembered" x="0" y="6">Word on his birthday</text><text class="tl-detail" x="0" y="22">Back from the hill movie to shouting in camp</text></g><path class="tl-mark tl-record" d="M126,599.338 130.6,603.938 126,608.538 121.4,603.938Z"/><path class="tl-tie" d="M133,603.938 150,603.938 150,425.5 160,425.5"/><g class="tl-row" transform="translate(168,425.5)"><text class="tl-date" x="0" y="-11">10 Sept 1944</text><text class="tl-title" x="0" y="6">Service book closes overseas</text><text class="tl-detail" x="0" y="22">His own hand ends the 90th Squadron at 9-10-44</text></g><path class="tl-mark tl-record" d="M126,638.755 130.6,643.355 126,647.955 121.4,643.355Z"/><path class="tl-tie" d="M133,643.355 150,643.355 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">29 Sept 1944</text><text class="tl-title" x="0" y="6">Foreign service ends</text><text class="tl-detail" x="0" y="22">Two years, seven months, twenty-nine days abroad</text></g><path class="tl-mark tl-memory" d="M126,656.264 130.6,660.864 126,665.464 121.4,660.864Z"/><path class="tl-tie" d="M133,660.864 150,660.864 150,533.5 160,533.5"/><g class="tl-row" transform="translate(168,533.5)"><text class="tl-date" x="0" y="-11">7 Oct 1944</text><text class="tl-title tl-remembered" x="0" y="6">Home to Cressona</text><text class="tl-detail" x="0" y="22">Back porch, the light on, and the dog</text></g><path class="tl-mark tl-record" d="M126,670.786 130.6,675.386 126,679.986 121.4,675.386Z"/><path class="tl-tie" d="M133,675.386 150,675.386 150,587.5 160,587.5"/><g class="tl-row" transform="translate(168,587.5)"><text class="tl-date" x="0" y="-11">14 Oct 1944</text><text class="tl-title" x="0" y="6">Marries Catherine Kline</text><text class="tl-detail" x="0" y="22">Two o'clock, St. Mark's; Rev. Mark G. Wagner</text></g><path class="tl-mark tl-press" d="M126,670.786 130.6,675.386 126,679.986 121.4,675.386Z"/><path class="tl-tie" d="M133,675.386 150,675.386 150,641.5 160,641.5"/><g class="tl-row" transform="translate(168,641.5)"><text class="tl-date" x="0" y="-11">by 14 Oct 1944</text><text class="tl-title" x="0" y="6">Master sergeant by now</text><text class="tl-detail" x="0" y="22">Chevrons on his sleeve in the wedding portrait</text></g><path class="tl-mark tl-memory tl-bar" d="M126,646.295 126,709.439"/><path class="tl-tie" d="M133,677.867 150,677.867 150,695.5 160,695.5"/><g class="tl-row" transform="translate(168,695.5)"><text class="tl-date" x="0" y="-11">Oct 1944</text><text class="tl-title tl-remembered" x="0" y="6">Twenty-one day delay</text><text class="tl-detail" x="0" y="22">A week's honeymoon by car, then reassignment</text></g><path class="tl-mark tl-press" d="M126,683.233 130.6,687.833 126,692.433 121.4,687.833Z"/><path class="tl-tie" d="M133,687.833 150,687.833 150,749.5 160,749.5"/><g class="tl-row" transform="translate(168,749.5)"><text class="tl-date" x="0" y="-11">20 Oct 1944</text><text class="tl-title" x="0" y="6">The wedding notice prints</text><text class="tl-detail" x="0" y="22">Both portraits, and thirty-two months overseas</text></g><path class="tl-mark tl-memory tl-bar" d="M126,709.439 126,772.583"/><path class="tl-tie" d="M133,741.011 150,741.011 150,803.5 160,803.5"/><g class="tl-row" transform="translate(168,803.5)"><text class="tl-date" x="0" y="-11">Nov 1944</text><text class="tl-title tl-remembered" x="0" y="6">Atlantic City redistribution</text><text class="tl-detail" x="0" y="22">Refused two grades to stay; posted to DeRidder</text></g><path class="tl-mark tl-record" d="M126,738.084 130.6,742.684 126,747.284 121.4,742.684Z"/><path class="tl-tie" d="M133,742.684 150,742.684 150,857.5 160,857.5"/><g class="tl-row" transform="translate(168,857.5)"><text class="tl-date" x="0" y="-11">16 Nov 1944</text><text class="tl-title" x="0" y="6">Joins the 399th</text><text class="tl-detail" x="0" y="22">399th Fighter Squadron, DeRidder Army Air Base</text></g><path class="tl-mark tl-unit" d="M126,843.575 130.6,848.175 126,852.775 121.4,848.175Z"/><path class="tl-tie" d="M133,848.175 150,848.175 150,911.5 160,911.5"/><g class="tl-row" transform="translate(168,911.5)"><text class="tl-date" x="0" y="-11">6 Jan 1945</text><text class="tl-title" x="0" y="6">Expert with the carbine</text><text class="tl-detail" x="0" y="22">Score 171 in record firing, Special Orders No. 6</text></g><path class="tl-mark tl-unit tl-bar" d="M126,900.038 126,913.398"/><path class="tl-tie" d="M133,906.718 150,906.718 150,965.5 160,965.5"/><g class="tl-row" transform="translate(168,965.5)"><text class="tl-date" x="0" y="-11">31 Jan – 7 Feb 1945</text><text class="tl-title" x="0" y="6">Malaria, DeRidder station hospital</text><text class="tl-detail" x="0" y="22">"Malaria, vivax (tertian)" on the admission card</text></g><path class="tl-mark tl-unit" d="M126,910.873 130.6,915.473 126,920.073 121.4,915.473Z"/><path class="tl-tie" d="M133,915.473 150,915.473 150,1019.5 160,1019.5"/><g class="tl-row" transform="translate(168,1019.5)"><text class="tl-date" x="0" y="-11">8 Feb 1945</text><text class="tl-title" x="0" y="6">Misses the move by a day</text><text class="tl-detail" x="0" y="22">Back to duty the 7th, the day the train left</text></g><path class="tl-mark tl-unit tl-bar" d="M126,995.218 126,1013.89"/><path class="tl-tie" d="M133,1004.55 150,1004.55 150,1073.5 160,1073.5"/><g class="tl-row" transform="translate(168,1073.5)"><text class="tl-date" x="0" y="-11">16–25 Mar 1945</text><text class="tl-title" x="0" y="6">Station hospital, Stuttgart</text><text class="tl-detail" x="0" y="22">The squadron's dates for the stay he called a weekend</text></g><path class="tl-mark tl-record" d="M126,1141.81 130.6,1146.41 126,1151.01 121.4,1146.41Z"/><path class="tl-tie" d="M133,1146.41 150,1146.41 150,1127.5 160,1127.5"/><g class="tl-row" transform="translate(168,1127.5)"><text class="tl-date" x="0" y="-11">28 May 1945</text><text class="tl-title" x="0" y="6">Leaves the 399th</text><text class="tl-detail" x="0" y="22">His service book closes the squadron at 5-28-45</text></g><path class="tl-mark tl-unit" d="M126,1141.81 130.6,1146.41 126,1151.01 121.4,1146.41Z"/><path class="tl-tie" d="M133,1146.41 150,1146.41 150,1181.5 160,1181.5"/><g class="tl-row" transform="translate(168,1181.5)"><text class="tl-date" x="0" y="-11">28 May 1945</text><text class="tl-title" x="0" y="6">Held at Camp Robinson</text><text class="tl-detail" x="0" y="22">Attached near Little Rock to await shipment to Fort Dix</text></g><path class="tl-mark tl-memory" d="M126,1145.96 130.6,1150.56 126,1155.16 121.4,1150.56Z"/><path class="tl-tie" d="M133,1150.56 150,1150.56 150,1235.5 160,1235.5"/><g class="tl-row" transform="translate(168,1235.5)"><text class="tl-date" x="0" y="-11">late May 1945</text><text class="tl-title tl-remembered" x="0" y="6">Told he is going out</text><text class="tl-detail" x="0" y="22">His own date: "May the 30th or in June"</text></g><path class="tl-mark tl-unit" d="M126,1148.03 130.6,1152.63 126,1157.23 121.4,1152.63Z"/><path class="tl-tie" d="M133,1152.63 150,1152.63 150,1289.5 160,1289.5"/><g class="tl-row" transform="translate(168,1289.5)"><text class="tl-date" x="0" y="-11">31 May 1945</text><text class="tl-title" x="0" y="6">Shipping List No. 9</text><text class="tl-detail" x="0" y="22">For discharge at Fort Dix; his points score, probably 113</text></g><path class="tl-mark tl-unit" d="M126,1148.03 130.6,1152.63 126,1157.23 121.4,1152.63Z"/><path class="tl-tie" d="M133,1152.63 150,1152.63 150,1343.5 160,1343.5"/><g class="tl-row" transform="translate(168,1343.5)"><text class="tl-date" x="0" y="-11">31 May 1945</text><text class="tl-title" x="0" y="6">On the Fort Dix roster</text><text class="tl-detail" x="0" y="22">Separation center, Company 22A</text></g><path class="tl-mark tl-unit" d="M126,1161.39 130.6,1165.99 126,1170.59 121.4,1165.99Z"/><path class="tl-tie" d="M133,1165.99 150,1165.99 150,1397.5 160,1397.5"/><g class="tl-row" transform="translate(168,1397.5)"><text class="tl-date" x="0" y="-11">7 June 1945</text><text class="tl-title" x="0" y="6">Orientation, Chapel 8</text><text class="tl-detail" x="0" y="22">The separation center's timetable for his last two days</text></g><path class="tl-mark tl-record" d="M126,1163.47 130.6,1168.07 126,1172.67 121.4,1168.07Z"/><path class="tl-tie" d="M133,1168.07 150,1168.07 150,1451.5 160,1451.5"/><g class="tl-row" transform="translate(168,1451.5)"><text class="tl-date" x="0" y="-11">8 June 1945</text><text class="tl-title" x="0" y="6">Separated at Fort Dix</text><text class="tl-detail" x="0" y="22">Three hundred dollars and $42.20 travel pay</text></g><path class="tl-mark tl-record" d="M126,1163.47 130.6,1168.07 126,1172.67 121.4,1168.07Z"/><path class="tl-tie" d="M133,1168.07 150,1168.07 150,1505.5 160,1505.5"/><g class="tl-row" transform="translate(168,1505.5)"><text class="tl-date" x="0" y="-11">8 June 1945</text><text class="tl-title" x="0" y="6">Separation stamp on his draft card</text><text class="tl-detail" x="0" y="22">The card itself gives his age as 26</text></g><path class="tl-mark tl-memory tl-bar" d="M126,1151.45 126,1214.59"/><path class="tl-tie" d="M133,1183.02 150,1183.02 150,1559.5 160,1559.5"/><g class="tl-row" transform="translate(168,1559.5)"><text class="tl-date" x="0" y="-11">summer 1945</text><text class="tl-title tl-remembered" x="0" y="6">A fortnight at the depot</text><text class="tl-detail" x="0" y="22">Sorting material shipped home from the war zones</text></g><path class="tl-mark tl-family tl-bar" d="M126,835.727 126,1593.45"/><path class="tl-tie" d="M133,1214.59 150,1214.59 150,1613.5 160,1613.5"/><g class="tl-row" transform="translate(168,1613.5)"><text class="tl-date" x="0" y="-11">1945</text><text class="tl-title" x="0" y="6">Chicago with his father</text><text class="tl-detail" x="0" y="22">Photographed on a street while at Coyne</text></g><path class="tl-mark tl-memory tl-bar" d="M126,1343.4 126,1532.84"/><path class="tl-tie" d="M133,1366.14 150,1366.14 150,1667.5 160,1667.5"/><g class="tl-row" transform="translate(168,1667.5)"><text class="tl-date" x="0" y="-11">spring 1945</text><text class="tl-title tl-remembered" x="0" y="6">Malaria again, Stuttgart</text><text class="tl-detail" x="0" y="22">A second hospital stay in Arkansas</text></g><path class="tl-mark tl-record tl-bar" d="M126,1593.45 126,1656.6"/><path class="tl-tie" d="M133,1625.03 150,1625.03 150,1721.5 160,1721.5"/><g class="tl-row" transform="translate(168,1721.5)"><text class="tl-date" x="0" y="-11">Jan 1946</text><text class="tl-title" x="0" y="6">Graduates Coyne, Chicago</text><text class="tl-detail" x="0" y="22">91.3 in electricity, 94.5 in radio-electronics</text></g><g class="tl-stick" transform="translate(92,983.273)"><path class="tl-stick-bar" d="M0,0 0,757.727"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,757.727 4,757.727"/><text class="tl-stick-label" x="8" y="382.864">one year</text></g><text class="pl-kicker" x="8" y="22">THE SERVICE YEARS · 4 of 4</text><text class="pl-title" x="8" y="48">Home, and out</text><text class="pl-sub" x="8" y="66">31 entries between 30 Jan 1944 and Jan 1946.</text></svg>