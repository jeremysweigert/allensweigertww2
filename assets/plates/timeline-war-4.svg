<svg class="plate tlplate" viewBox="0 0 840 1836" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>Home, and out</title><desc>A vertical timeline of Allen Sweigert's service. Years run down a rail at the left, to scale; each event sits in a row to its right.</desc><path class="tl-rail" d="M126,78 126,1799"/><path class="tl-year-rule" d="M82,78 822,78"/><text class="tl-year" x="76" y="83" text-anchor="end">1944</text><path class="tl-year-rule" d="M82,860.273 822,860.273"/><text class="tl-year" x="76" y="865.273" text-anchor="end">1945</text><path class="tl-year-rule" d="M82,1642.55 822,1642.55"/><text class="tl-year" x="76" y="1647.55" text-anchor="end">1946</text><path class="tl-mark tl-unit" d="M126,137.652 130.6,142.252 126,146.852 121.4,142.252Z"/><path class="tl-tie" d="M133,142.252 150,142.252 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">30 Jan 1944</text><text class="tl-title" x="0" y="6">90th Squadron to Nadzab</text><text class="tl-detail" x="0" y="22">Group headquarters followed on 3 February</text></g><path class="tl-mark tl-record" d="M126,257.333 130.6,261.933 126,266.533 121.4,261.933Z"/><path class="tl-tie" d="M133,261.933 150,261.933 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">25 Mar 1944</text><text class="tl-title" x="0" y="6">Distinguished Unit Badge</text><text class="tl-detail" x="0" y="22">General Order 3, Headquarters 3d Attack Group</text></g><path class="tl-mark tl-unit" d="M126,303.252 130.6,307.852 126,312.452 121.4,307.852Z"/><path class="tl-tie" d="M133,307.852 150,307.852 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">16 Apr 1944</text><text class="tl-title" x="0" y="6">Black Sunday at Nadzab</text><text class="tl-detail" x="0" y="22">Thirty-seven aircraft lost to weather, none to the enemy</text></g><path class="tl-mark tl-unit" d="M126,359.88 130.6,364.48 126,369.08 121.4,364.48Z"/><path class="tl-tie" d="M133,364.48 150,364.48 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">12 May 1944</text><text class="tl-title" x="0" y="6">Ashore at Hollandia</text><text class="tl-detail" x="0" y="22">Waded in behind the LSTs; prisoners marched past</text></g><path class="tl-mark tl-memory tl-bar" d="M126,406.555 126,602.123"/><path class="tl-tie" d="M133,508.25 150,508.25 150,317.5 160,317.5"/><g class="tl-row" transform="translate(168,317.5)"><text class="tl-date" x="0" y="-11">summer 1944</text><text class="tl-title tl-remembered" x="0" y="6">The Bob Hope show</text><text class="tl-detail" x="0" y="22">He drew the lucky half of the crew</text></g><path class="tl-mark tl-memory" d="M126,614.234 130.6,618.834 126,623.434 121.4,618.834Z"/><path class="tl-tie" d="M133,618.834 150,618.834 150,371.5 160,371.5"/><g class="tl-row" transform="translate(168,371.5)"><text class="tl-date" x="0" y="-11">9 Sept 1944</text><text class="tl-title tl-remembered" x="0" y="6">Word on his birthday</text><text class="tl-detail" x="0" y="22">Back from the hill movie to shouting in camp</text></g><path class="tl-mark tl-record" d="M126,616.375 130.6,620.975 126,625.575 121.4,620.975Z"/><path class="tl-tie" d="M133,620.975 150,620.975 150,425.5 160,425.5"/><g class="tl-row" transform="translate(168,425.5)"><text class="tl-date" x="0" y="-11">10 Sept 1944</text><text class="tl-title" x="0" y="6">Service book closes overseas</text><text class="tl-detail" x="0" y="22">His own hand ends the 90th Squadron at 9-10-44</text></g><path class="tl-mark tl-record" d="M126,657.069 130.6,661.669 126,666.269 121.4,661.669Z"/><path class="tl-tie" d="M133,661.669 150,661.669 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">29 Sept 1944</text><text class="tl-title" x="0" y="6">Foreign service ends</text><text class="tl-detail" x="0" y="22">Two years, seven months, twenty-nine days abroad</text></g><path class="tl-mark tl-memory" d="M126,675.145 130.6,679.745 126,684.345 121.4,679.745Z"/><path class="tl-tie" d="M133,679.745 150,679.745 150,533.5 160,533.5"/><g class="tl-row" transform="translate(168,533.5)"><text class="tl-date" x="0" y="-11">7 Oct 1944</text><text class="tl-title tl-remembered" x="0" y="6">Home to Cressona</text><text class="tl-detail" x="0" y="22">Back porch, the light on, and the dog</text></g><path class="tl-mark tl-record" d="M126,690.137 130.6,694.737 126,699.337 121.4,694.737Z"/><path class="tl-tie" d="M133,694.737 150,694.737 150,587.5 160,587.5"/><g class="tl-row" transform="translate(168,587.5)"><text class="tl-date" x="0" y="-11">14 Oct 1944</text><text class="tl-title" x="0" y="6">Marries Catherine Kline</text><text class="tl-detail" x="0" y="22">Two o'clock, St. Mark's; Rev. Mark G. Wagner</text></g><path class="tl-mark tl-press" d="M126,690.137 130.6,694.737 126,699.337 121.4,694.737Z"/><path class="tl-tie" d="M133,694.737 150,694.737 150,641.5 160,641.5"/><g class="tl-row" transform="translate(168,641.5)"><text class="tl-date" x="0" y="-11">by 14 Oct 1944</text><text class="tl-title" x="0" y="6">Master sergeant by now</text><text class="tl-detail" x="0" y="22">Chevrons on his sleeve in the wedding portrait</text></g><path class="tl-mark tl-memory tl-bar" d="M126,664.705 126,729.894"/><path class="tl-tie" d="M133,697.299 160,695.5"/><g class="tl-row" transform="translate(168,695.5)"><text class="tl-date" x="0" y="-11">Oct 1944</text><text class="tl-title tl-remembered" x="0" y="6">Twenty-one day delay</text><text class="tl-detail" x="0" y="22">A week's honeymoon by car, then reassignment</text></g><path class="tl-mark tl-press" d="M126,702.988 130.6,707.588 126,712.188 121.4,707.588Z"/><path class="tl-tie" d="M133,707.588 150,707.588 150,749.5 160,749.5"/><g class="tl-row" transform="translate(168,749.5)"><text class="tl-date" x="0" y="-11">20 Oct 1944</text><text class="tl-title" x="0" y="6">The wedding notice prints</text><text class="tl-detail" x="0" y="22">Both portraits, and thirty-two months overseas</text></g><path class="tl-mark tl-memory tl-bar" d="M126,729.894 126,795.083"/><path class="tl-tie" d="M133,762.489 150,762.489 150,803.5 160,803.5"/><g class="tl-row" transform="translate(168,803.5)"><text class="tl-date" x="0" y="-11">Nov 1944</text><text class="tl-title tl-remembered" x="0" y="6">Atlantic City redistribution</text><text class="tl-detail" x="0" y="22">Refused two grades to stay; posted to DeRidder</text></g><path class="tl-mark tl-record" d="M126,759.615 130.6,764.215 126,768.815 121.4,764.215Z"/><path class="tl-tie" d="M133,764.215 150,764.215 150,857.5 160,857.5"/><g class="tl-row" transform="translate(168,857.5)"><text class="tl-date" x="0" y="-11">16 Nov 1944</text><text class="tl-title" x="0" y="6">Joins the 399th</text><text class="tl-detail" x="0" y="22">399th Fighter Squadron, DeRidder Army Air Base</text></g><path class="tl-mark tl-unit" d="M126,868.523 130.6,873.123 126,877.723 121.4,873.123Z"/><path class="tl-tie" d="M133,873.123 150,873.123 150,911.5 160,911.5"/><g class="tl-row" transform="translate(168,911.5)"><text class="tl-date" x="0" y="-11">6 Jan 1945</text><text class="tl-title" x="0" y="6">Expert with the carbine</text><text class="tl-detail" x="0" y="22">Score 171 in record firing, Special Orders No. 6</text></g><path class="tl-mark tl-unit" d="M126,874.948 130.6,879.548 126,884.148 121.4,879.548Z"/><path class="tl-tie" d="M133,879.548 150,879.548 150,965.5 160,965.5"/><g class="tl-row" transform="translate(168,965.5)"><text class="tl-date" x="0" y="-11">9 Jan 1945</text><text class="tl-title" x="0" y="6">Twenty-one days' furlough</text><text class="tl-detail" x="0" y="22">Ordinary furlough from DeRidder; back to duty 31 January</text></g><path class="tl-mark tl-unit tl-bar" d="M126,926.667 126,940.46"/><path class="tl-tie" d="M133,933.563 150,933.563 150,1019.5 160,1019.5"/><g class="tl-row" transform="translate(168,1019.5)"><text class="tl-date" x="0" y="-11">31 Jan – 7 Feb 1945</text><text class="tl-title" x="0" y="6">Malaria, DeRidder station hospital</text><text class="tl-detail" x="0" y="22">"Malaria, vivax (tertian)" on the admission card</text></g><path class="tl-mark tl-unit" d="M126,938.001 130.6,942.601 126,947.201 121.4,942.601Z"/><path class="tl-tie" d="M133,942.601 150,942.601 150,1073.5 160,1073.5"/><g class="tl-row" transform="translate(168,1073.5)"><text class="tl-date" x="0" y="-11">8 Feb 1945</text><text class="tl-title" x="0" y="6">Misses the move by a day</text><text class="tl-detail" x="0" y="22">Back to duty the 7th, the day the train left</text></g><path class="tl-mark tl-unit tl-bar" d="M126,1024.93 126,1044.21"/><path class="tl-tie" d="M133,1034.57 150,1034.57 150,1127.5 160,1127.5"/><g class="tl-row" transform="translate(168,1127.5)"><text class="tl-date" x="0" y="-11">16–25 Mar 1945</text><text class="tl-title" x="0" y="6">Station hospital, Stuttgart</text><text class="tl-detail" x="0" y="22">The squadron's dates for the stay he called a weekend</text></g><path class="tl-mark tl-record" d="M126,1176.42 130.6,1181.02 126,1185.62 121.4,1181.02Z"/><path class="tl-tie" d="M133,1181.02 160,1181.5"/><g class="tl-row" transform="translate(168,1181.5)"><text class="tl-date" x="0" y="-11">28 May 1945</text><text class="tl-title" x="0" y="6">Leaves the 399th</text><text class="tl-detail" x="0" y="22">His service book closes the squadron at 5-28-45</text></g><path class="tl-mark tl-unit" d="M126,1176.42 130.6,1181.02 126,1185.62 121.4,1181.02Z"/><path class="tl-tie" d="M133,1181.02 150,1181.02 150,1235.5 160,1235.5"/><g class="tl-row" transform="translate(168,1235.5)"><text class="tl-date" x="0" y="-11">28 May 1945</text><text class="tl-title" x="0" y="6">Held at Camp Robinson</text><text class="tl-detail" x="0" y="22">Attached near Little Rock to await shipment to Fort Dix</text></g><path class="tl-mark tl-memory" d="M126,1180.7 130.6,1185.3 126,1189.9 121.4,1185.3Z"/><path class="tl-tie" d="M133,1185.3 150,1185.3 150,1289.5 160,1289.5"/><g class="tl-row" transform="translate(168,1289.5)"><text class="tl-date" x="0" y="-11">late May 1945</text><text class="tl-title tl-remembered" x="0" y="6">Told he is going out</text><text class="tl-detail" x="0" y="22">His own date: "May the 30th or in June"</text></g><path class="tl-mark tl-unit" d="M126,1182.85 130.6,1187.45 126,1192.05 121.4,1187.45Z"/><path class="tl-tie" d="M133,1187.45 150,1187.45 150,1343.5 160,1343.5"/><g class="tl-row" transform="translate(168,1343.5)"><text class="tl-date" x="0" y="-11">31 May 1945</text><text class="tl-title" x="0" y="6">Shipping List No. 9</text><text class="tl-detail" x="0" y="22">For discharge at Fort Dix; his points score, probably 113</text></g><path class="tl-mark tl-unit" d="M126,1182.85 130.6,1187.45 126,1192.05 121.4,1187.45Z"/><path class="tl-tie" d="M133,1187.45 150,1187.45 150,1397.5 160,1397.5"/><g class="tl-row" transform="translate(168,1397.5)"><text class="tl-date" x="0" y="-11">31 May 1945</text><text class="tl-title" x="0" y="6">On the Fort Dix roster</text><text class="tl-detail" x="0" y="22">Separation center, Company 22A</text></g><path class="tl-mark tl-unit" d="M126,1196.64 130.6,1201.24 126,1205.84 121.4,1201.24Z"/><path class="tl-tie" d="M133,1201.24 150,1201.24 150,1451.5 160,1451.5"/><g class="tl-row" transform="translate(168,1451.5)"><text class="tl-date" x="0" y="-11">7 June 1945</text><text class="tl-title" x="0" y="6">Orientation, Chapel 8</text><text class="tl-detail" x="0" y="22">The separation center's timetable for his last two days</text></g><path class="tl-mark tl-record" d="M126,1198.78 130.6,1203.38 126,1207.98 121.4,1203.38Z"/><path class="tl-tie" d="M133,1203.38 150,1203.38 150,1505.5 160,1505.5"/><g class="tl-row" transform="translate(168,1505.5)"><text class="tl-date" x="0" y="-11">8 June 1945</text><text class="tl-title" x="0" y="6">Separated at Fort Dix</text><text class="tl-detail" x="0" y="22">Three hundred dollars and $42.20 travel pay</text></g><path class="tl-mark tl-record" d="M126,1198.78 130.6,1203.38 126,1207.98 121.4,1203.38Z"/><path class="tl-tie" d="M133,1203.38 150,1203.38 150,1559.5 160,1559.5"/><g class="tl-row" transform="translate(168,1559.5)"><text class="tl-date" x="0" y="-11">8 June 1945</text><text class="tl-title" x="0" y="6">Separation stamp on his draft card</text><text class="tl-detail" x="0" y="22">The card itself gives his age as 26</text></g><path class="tl-mark tl-memory tl-bar" d="M126,1186.22 126,1251.41"/><path class="tl-tie" d="M133,1218.81 150,1218.81 150,1613.5 160,1613.5"/><g class="tl-row" transform="translate(168,1613.5)"><text class="tl-date" x="0" y="-11">summer 1945</text><text class="tl-title tl-remembered" x="0" y="6">A fortnight at the depot</text><text class="tl-detail" x="0" y="22">Sorting material shipped home from the war zones</text></g><path class="tl-mark tl-family tl-bar" d="M126,860.273 126,1642.55"/><path class="tl-tie" d="M133,1251.41 150,1251.41 150,1667.5 160,1667.5"/><g class="tl-row" transform="translate(168,1667.5)"><text class="tl-date" x="0" y="-11">1945</text><text class="tl-title" x="0" y="6">Chicago with his father</text><text class="tl-detail" x="0" y="22">Photographed on a street while at Coyne</text></g><path class="tl-mark tl-memory tl-bar" d="M126,1384.4 126,1579.96"/><path class="tl-tie" d="M133,1407.86 150,1407.86 150,1721.5 160,1721.5"/><g class="tl-row" transform="translate(168,1721.5)"><text class="tl-date" x="0" y="-11">spring 1945</text><text class="tl-title tl-remembered" x="0" y="6">Malaria again, Stuttgart</text><text class="tl-detail" x="0" y="22">A second hospital stay in Arkansas</text></g><path class="tl-mark tl-record tl-bar" d="M126,1642.55 126,1707.73"/><path class="tl-tie" d="M133,1675.14 150,1675.14 150,1775.5 160,1775.5"/><g class="tl-row" transform="translate(168,1775.5)"><text class="tl-date" x="0" y="-11">Jan 1946</text><text class="tl-title" x="0" y="6">Graduates Coyne, Chicago</text><text class="tl-detail" x="0" y="22">91.3 in electricity, 94.5 in radio-electronics</text></g><g class="tl-stick" transform="translate(92,1012.73)"><path class="tl-stick-bar" d="M0,0 0,782.273"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,782.273 4,782.273"/><text class="tl-stick-label" x="8" y="395.136">one year</text></g><text class="pl-kicker" x="8" y="22">THE SERVICE YEARS · 4 of 4</text><text class="pl-title" x="8" y="48">Home, and out</text><text class="pl-sub" x="8" y="66">32 entries between 30 Jan 1944 and Jan 1946.</text></svg>