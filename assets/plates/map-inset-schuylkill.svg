<svg class="plate mapplate inset" viewBox="0 0 560 322.8" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>Schuylkill County: the four miles he drilled</title><desc>An inset of Schuylkill County, Pennsylvania. Cressona, where he was born; Pottsville, four miles up the Schuylkill, where Battery F drilled; Schuylkill Haven, whose weekly paper followed him through the war; Kutztown over the county line, where Catherine took her teaching degree; and Indiantown Gap to the south-west.</desc><rect class="map-sea" x="0" y="0" width="560" height="322.8"/><path class="map-land" d="M-84,371.22 -84,-48.42 644,-48.42 644,371.22Z"/><path class="map-state" d="M643.3,-67.1 588.4,-26.2 607.6,33.4 567.4,90 566.5,163.9 604.4,177.9 611,226.4 722.8,343.9"/><rect class="map-frame" x=".5" y=".5" width="559" height="321.8"/><path class="leg leg-unknown" d="M220.096,135.085 Q223.264,131.988 219.404,129.815"/><path class="chev chev-unknown" transform="translate(221.507,132.219) rotate(-97.49)" d="M-5,-4 0,0 -5,4"/><g class="pl" transform="translate(221.4,145)"><circle class="mk-him" r="6"/><path class="pl-lead" d="M8,0 4,15 11,15"/><text class="pl-name" x="13" y="20" text-anchor="start">Cressona</text><text class="pl-date" x="13" y="39" text-anchor="start">born 9 Sept 1918</text></g><g class="pl" transform="translate(218.1,119.9)"><circle class="mk-him" r="6"/><path class="pl-lead" d="M-8,0 -6,0 -13,0"/><text class="pl-name" x="-15" y="5" text-anchor="end">Pottsville</text><text class="pl-date" x="-15" y="24" text-anchor="end">the armory</text></g><g class="pl" transform="translate(228.6,146)"><circle class="mk-him" r="6"/><path class="pl-lead" d="M0,8 0,103.2"/><text class="pl-name" x="0" y="109.2" text-anchor="middle">Schuylkill Haven</text><text class="pl-date" x="0" y="128.2" text-anchor="middle">The Call, his letter</text></g><g class="pl" transform="translate(366.2,196.7)"><circle class="mk-him" r="6"/><path class="pl-lead" d="M0,8 0,20"/><text class="pl-name" x="0" y="26" text-anchor="middle">Kutztown</text><text class="pl-date" x="0" y="45" text-anchor="middle">Catherine's college, 1941</text></g><g class="pl" transform="translate(471.1,157.7)"><rect class="mk-grp" x="-5.5" y="-5.5" width="11" height="11"/><path class="pl-lead" d="M-8,0 -45.6,-55.4 -52.6,-55.4"/><text class="pl-name" x="-54.6" y="-50.4" text-anchor="end">Allentown</text><text class="pl-date" x="-54.6" y="-31.4" text-anchor="end">regimental headquarters</text></g><g class="sc" transform="translate(451.5,276.8)"><path class="sc-bar" d="M0,0 82.5,0"/><path class="sc-bar" d="M0,-4 0,4"/><path class="sc-bar" d="M82.5,-4 82.5,4"/><text class="sc-label" x="41.25" y="-8" text-anchor="middle">20 km</text></g><text class="pl-kicker" x="26" y="20">INSET</text><text class="pl-title" x="26" y="46">Schuylkill County</text><text class="pl-sub" x="26" y="64">Three of these sit within a pen-width on the national map</text></svg>