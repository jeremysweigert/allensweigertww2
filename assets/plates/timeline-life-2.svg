<svg class="plate tlplate" viewBox="0 0 840 1188" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>The service years, 1936–1946</title><desc>A vertical timeline. Years run down a rail at the left, to scale. Each event sits in a row to its right, joined to its moment on the rail by a bracket.</desc><path class="tl-rail" d="M126,78 126,1151"/><path class="tl-year-rule" d="M82,78 822,78"/><text class="tl-year" x="76" y="83" text-anchor="end">1936</text><path class="tl-year-rule" d="M82,175.545 822,175.545"/><text class="tl-year" x="76" y="180.545" text-anchor="end">1937</text><path class="tl-year-rule" d="M82,273.091 822,273.091"/><text class="tl-year" x="76" y="278.091" text-anchor="end">1938</text><path class="tl-year-rule" d="M82,370.636 822,370.636"/><text class="tl-year" x="76" y="375.636" text-anchor="end">1939</text><path class="tl-year-rule" d="M82,468.182 822,468.182"/><text class="tl-year" x="76" y="473.182" text-anchor="end">1940</text><path class="tl-year-rule" d="M82,565.727 822,565.727"/><text class="tl-year" x="76" y="570.727" text-anchor="end">1941</text><path class="tl-year-rule" d="M82,663.273 822,663.273"/><text class="tl-year" x="76" y="668.273" text-anchor="end">1942</text><path class="tl-year-rule" d="M82,760.818 822,760.818"/><text class="tl-year" x="76" y="765.818" text-anchor="end">1943</text><path class="tl-year-rule" d="M82,858.364 822,858.364"/><text class="tl-year" x="76" y="863.364" text-anchor="end">1944</text><path class="tl-year-rule" d="M82,955.909 822,955.909"/><text class="tl-year" x="76" y="960.909" text-anchor="end">1945</text><path class="tl-year-rule" d="M82,1053.45 822,1053.45"/><text class="tl-year" x="76" y="1058.45" text-anchor="end">1946</text><path class="tl-year-rule" d="M82,1151 822,1151"/><text class="tl-year" x="76" y="1156" text-anchor="end">1947</text><path class="tl-rank" d="M95,675.466 95,700.865 102,700.865 102,768.563 102,768.563 102,935.268 102,935.268"/><path class="tl-mark tl-memory tl-bar" d="M126,78 126,175.545"/><path class="tl-tie" d="M133,126.773 150,126.773 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">late 1936</text><text class="tl-title tl-remembered" x="0" y="6">Enlists in the Guard</text><text class="tl-detail" x="0" y="22">For the drill pay, not for patriotism</text></g><path class="tl-mark tl-press" d="M126,532.891 130.6,537.491 126,542.091 121.4,537.491Z"/><path class="tl-tie" d="M133,537.491 150,537.491 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">16 Sept 1940</text><text class="tl-title" x="0" y="6">Enters federal service</text><text class="tl-detail" x="0" y="22">At Pottsville with the 213th C.A. (A.A.)</text></g><path class="tl-mark tl-record" d="M126,588.186 130.6,592.786 126,597.386 121.4,592.786Z"/><path class="tl-tie" d="M133,592.786 150,592.786 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">10 Apr 1941</text><text class="tl-title" x="0" y="6">Guard out, Air Corps in</text><text class="tl-detail" x="0" y="22">Discharged at his own request; enlisted at Savannah</text></g><path class="tl-mark tl-letter" d="M126,641.503 130.6,646.103 126,650.703 121.4,646.103Z"/><path class="tl-tie" d="M133,646.103 150,646.103 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">27 Oct 1941</text><text class="tl-title" x="0" y="6">Graduates Scott Field</text><text class="tl-detail" x="0" y="22">"Graduated from the Air Corps technical schools"</text></g><path class="tl-mark tl-record" d="M126,666.952 130.6,671.552 126,676.152 121.4,671.552Z"/><path class="tl-tie" d="M133,671.552 150,671.552 150,317.5 160,317.5"/><g class="tl-row" transform="translate(168,317.5)"><text class="tl-date" x="0" y="-11">31 Jan 1942</text><text class="tl-title" x="0" y="6">Convoy 2030 sails</text><text class="tl-detail" x="0" y="22">USAT Ancon out of San Francisco; foreign service starts</text></g><path class="tl-mark tl-letter tl-bar" d="M126,671.402 126,679.53"/><path class="tl-tie" d="M133,675.466 150,675.466 150,371.5 160,371.5"/><g class="tl-row" transform="translate(168,371.5)"><text class="tl-date" x="0" y="-11">at sea, Feb 1942</text><text class="tl-title" x="0" y="6">Made corporal at sea</text><text class="tl-detail" x="0" y="22">Inside a twenty-five day window; no day given</text></g><path class="tl-mark tl-unit" d="M126,673.479 130.6,678.079 126,682.679 121.4,678.079Z"/><path class="tl-tie" d="M133,678.079 150,678.079 150,425.5 160,425.5"/><g class="tl-row" transform="translate(168,425.5)"><text class="tl-date" x="0" y="-11">25 Feb 1942</text><text class="tl-title" x="0" y="6">Ancon docks at Brisbane</text><text class="tl-detail" x="0" y="22">Arrived with no aeroplanes and a lieutenant commanding</text></g><path class="tl-mark tl-letter" d="M126,696.265 130.6,700.865 126,705.465 121.4,700.865Z"/><path class="tl-tie" d="M133,700.865 150,700.865 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">by 19 May 1942</text><text class="tl-title" x="0" y="6">Promoted sergeant</text><text class="tl-detail" x="0" y="22">"Recently I was promoted to Sergeant"</text></g><path class="tl-mark tl-letter" d="M126,696.265 130.6,700.865 126,705.465 121.4,700.865Z"/><path class="tl-tie" d="M133,700.865 150,700.865 150,533.5 160,533.5"/><g class="tl-row" transform="translate(168,533.5)"><text class="tl-date" x="0" y="-11">19 May 1942</text><text class="tl-title" x="0" y="6">Writes home to The Call</text><text class="tl-detail" x="0" y="22">The only thing he wrote at the time</text></g><path class="tl-mark tl-unit" d="M126,763.696 130.6,768.296 126,772.896 121.4,768.296Z"/><path class="tl-tie" d="M133,768.296 150,768.296 150,587.5 160,587.5"/><g class="tl-row" transform="translate(168,587.5)"><text class="tl-date" x="0" y="-11">28 Jan 1943</text><text class="tl-title" x="0" y="6">Group to Port Moresby</text><text class="tl-detail" x="0" y="22">90th Squadron to 3-Mile Drome, Kila</text></g><path class="tl-mark tl-press" d="M126,763.963 130.6,768.563 126,773.163 121.4,768.563Z"/><path class="tl-tie" d="M133,768.563 150,768.563 150,641.5 160,641.5"/><g class="tl-row" transform="translate(168,641.5)"><text class="tl-date" x="0" y="-11">by 29 Jan 1943</text><text class="tl-title" x="0" y="6">Staff sergeant by now</text><text class="tl-detail" x="0" y="22">The paper sets his grade as staff sergeant</text></g><path class="tl-mark tl-unit" d="M126,773.278 130.6,777.878 126,782.478 121.4,777.878Z"/><path class="tl-tie" d="M133,777.878 150,777.878 150,695.5 160,695.5"/><g class="tl-row" transform="translate(168,695.5)"><text class="tl-date" x="0" y="-11">3 Mar 1943</text><text class="tl-title" x="0" y="6">Battle of the Bismarck Sea</text><text class="tl-detail" x="0" y="22">His squadron's strafers hit every ship in the convoy</text></g><path class="tl-mark tl-unit" d="M126,794.077 130.6,798.677 126,803.277 121.4,798.677Z"/><path class="tl-tie" d="M133,798.677 150,798.677 150,749.5 160,749.5"/><g class="tl-row" transform="translate(168,749.5)"><text class="tl-date" x="0" y="-11">20 May 1943</text><text class="tl-title" x="0" y="6">Forward to Dobodura</text><text class="tl-detail" x="0" y="22">Group 20 May, the 90th Squadron logged 21 May</text></g><path class="tl-mark tl-unit" d="M126,861.776 130.6,866.376 126,870.976 121.4,866.376Z"/><path class="tl-tie" d="M133,866.376 150,866.376 150,803.5 160,803.5"/><g class="tl-row" transform="translate(168,803.5)"><text class="tl-date" x="0" y="-11">30 Jan 1944</text><text class="tl-title" x="0" y="6">90th Squadron to Nadzab</text><text class="tl-detail" x="0" y="22">Group headquarters followed on 3 February</text></g><path class="tl-mark tl-unit" d="M126,889.486 130.6,894.086 126,898.686 121.4,894.086Z"/><path class="tl-tie" d="M133,894.086 150,894.086 150,857.5 160,857.5"/><g class="tl-row" transform="translate(168,857.5)"><text class="tl-date" x="0" y="-11">12 May 1944</text><text class="tl-title" x="0" y="6">Ashore at Hollandia</text><text class="tl-detail" x="0" y="22">Waded in behind the LSTs; prisoners marched past</text></g><path class="tl-mark tl-record" d="M126,926.544 130.6,931.144 126,935.744 121.4,931.144Z"/><path class="tl-tie" d="M133,931.144 150,931.144 150,911.5 160,911.5"/><g class="tl-row" transform="translate(168,911.5)"><text class="tl-date" x="0" y="-11">29 Sept 1944</text><text class="tl-title" x="0" y="6">Foreign service ends</text><text class="tl-detail" x="0" y="22">Two years, seven months, twenty-nine days abroad</text></g><path class="tl-mark tl-record" d="M126,930.668 130.6,935.268 126,939.868 121.4,935.268Z"/><path class="tl-tie" d="M133,935.268 150,935.268 150,965.5 160,965.5"/><g class="tl-row" transform="translate(168,965.5)"><text class="tl-date" x="0" y="-11">14 Oct 1944</text><text class="tl-title" x="0" y="6">Marries Catherine Kline</text><text class="tl-detail" x="0" y="22">Two o'clock, St. Mark's; Rev. Mark G. Wagner</text></g><path class="tl-mark tl-press" d="M126,930.668 130.6,935.268 126,939.868 121.4,935.268Z"/><path class="tl-tie" d="M133,935.268 150,935.268 150,1019.5 160,1019.5"/><g class="tl-row" transform="translate(168,1019.5)"><text class="tl-date" x="0" y="-11">by 14 Oct 1944</text><text class="tl-title" x="0" y="6">Master sergeant by now</text><text class="tl-detail" x="0" y="22">Chevrons on his sleeve in the wedding portrait</text></g><path class="tl-mark tl-record" d="M126,994.093 130.6,998.693 126,1003.29 121.4,998.693Z"/><path class="tl-tie" d="M133,998.693 150,998.693 150,1073.5 160,1073.5"/><g class="tl-row" transform="translate(168,1073.5)"><text class="tl-date" x="0" y="-11">8 June 1945</text><text class="tl-title" x="0" y="6">Separated at Fort Dix</text><text class="tl-detail" x="0" y="22">Three hundred dollars and $42.20 travel pay</text></g><path class="tl-mark tl-record tl-bar" d="M126,1053.45 126,1061.58"/><path class="tl-tie" d="M133,1057.52 150,1057.52 150,1127.5 160,1127.5"/><g class="tl-row" transform="translate(168,1127.5)"><text class="tl-date" x="0" y="-11">Jan 1946</text><text class="tl-title" x="0" y="6">Graduates Coyne, Chicago</text><text class="tl-detail" x="0" y="22">91.3 in electricity, 94.5 in radio-electronics</text></g><g class="tl-stick" transform="translate(92,1049.45)"><path class="tl-stick-bar" d="M0,0 0,97.5455"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,97.5455 4,97.5455"/><text class="tl-stick-label" x="8" y="52.7727">one year</text></g><text class="pl-kicker" x="8" y="22">A LIFE IN BRIEF · 2 of 4</text><text class="pl-title" x="8" y="48">The service years, 1936–1946</text><text class="pl-sub" x="8" y="66">20 entries. The rail at the left runs to scale; the rows do not, and a bracket joins each to its own moment.</text></svg>