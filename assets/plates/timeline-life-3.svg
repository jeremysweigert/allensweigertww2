<svg class="plate tlplate" viewBox="0 0 840 2088" role="img" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title>Cressona, and the plant, 1947–1979</title><desc>A vertical timeline. Years run down a rail at the left, to scale. Each event sits in a row to its right, joined to its moment on the rail by a bracket.</desc><path class="tl-rail" d="M126,78 126,2051"/><path class="tl-year-rule" d="M82,257.364 822,257.364"/><text class="tl-year" x="76" y="262.364" text-anchor="end">1950</text><path class="tl-year-rule" d="M82,556.303 822,556.303"/><text class="tl-year" x="76" y="561.303" text-anchor="end">1955</text><path class="tl-year-rule" d="M82,855.242 822,855.242"/><text class="tl-year" x="76" y="860.242" text-anchor="end">1960</text><path class="tl-year-rule" d="M82,1154.18 822,1154.18"/><text class="tl-year" x="76" y="1159.18" text-anchor="end">1965</text><path class="tl-year-rule" d="M82,1453.12 822,1453.12"/><text class="tl-year" x="76" y="1458.12" text-anchor="end">1970</text><path class="tl-year-rule" d="M82,1752.06 822,1752.06"/><text class="tl-year" x="76" y="1757.06" text-anchor="end">1975</text><path class="tl-year-rule" d="M82,2051 822,2051"/><text class="tl-year" x="76" y="2056" text-anchor="end">1980</text><path class="tl-mark tl-family" d="M126,77.0012 130.6,81.6012 126,86.2012 121.4,81.6012Z"/><path class="tl-tie" d="M133,81.6012 150,81.6012 150,101.5 160,101.5"/><g class="tl-row" transform="translate(168,101.5)"><text class="tl-date" x="0" y="-11">22 Jan 1947</text><text class="tl-title" x="0" y="6">Allen Jr. is born</text><text class="tl-detail" x="0" y="22">Allen E. Sweigert, Jr. — Buddy</text></g><path class="tl-mark tl-press" d="M126,101.26 130.6,105.86 126,110.46 121.4,105.86Z"/><path class="tl-tie" d="M133,105.86 150,105.86 150,155.5 160,155.5"/><g class="tl-row" transform="translate(168,155.5)"><text class="tl-date" x="0" y="-11">18 June 1947</text><text class="tl-title" x="0" y="6">Charter member, Cressona Lions</text><text class="tl-detail" x="0" y="22">Charter night at the Necho Allen Hotel; he and Catherine both there</text></g><path class="tl-mark tl-memory tl-bar" d="M126,78 126,137.788"/><path class="tl-tie" d="M133,107.894 150,107.894 150,209.5 160,209.5"/><g class="tl-row" transform="translate(168,209.5)"><text class="tl-date" x="0" y="-11">1947</text><text class="tl-title tl-remembered" x="0" y="6">Opens his own radio shop</text><text class="tl-detail" x="0" y="22">Chestnut Street, Cressona, after Coyne and a Chicago distributor</text></g><path class="tl-mark tl-record tl-bar" d="M126,122.841 126,127.823"/><path class="tl-tie" d="M133,125.332 150,125.332 150,263.5 160,263.5"/><g class="tl-row" transform="translate(168,263.5)"><text class="tl-date" x="0" y="-11">About October 1947</text><text class="tl-title" x="0" y="6">Apprenticed at Alcoa</text><text class="tl-detail" x="0" y="22">Counted back from the certificate: 3½ years of training to 30 April 1951</text></g><path class="tl-mark tl-press" d="M126,125.192 130.6,129.792 126,134.392 121.4,129.792Z"/><path class="tl-tie" d="M133,129.792 150,129.792 150,317.5 160,317.5"/><g class="tl-row" transform="translate(168,317.5)"><text class="tl-date" x="0" y="-11">12 November 1947</text><text class="tl-title" x="0" y="6">Philco dealer, first printing</text><text class="tl-detail" x="0" y="22">Named under CRESSONA in Philco's own dealer list</text></g><path class="tl-mark tl-press" d="M126,128.701 130.6,133.301 126,137.901 121.4,133.301Z"/><path class="tl-tie" d="M133,133.301 150,133.301 150,371.5 160,371.5"/><g class="tl-row" transform="translate(168,371.5)"><text class="tl-date" x="0" y="-11">3 Dec 1947</text><text class="tl-title" x="0" y="6">Philco's dealer for Cressona</text><text class="tl-detail" x="0" y="22">The only name under the town in a full page</text></g><path class="tl-mark tl-record tl-bar" d="M126,137.788 126,197.576"/><path class="tl-tie" d="M133,167.682 150,167.682 150,425.5 160,425.5"/><g class="tl-row" transform="translate(168,425.5)"><text class="tl-date" x="0" y="-11">1948</text><text class="tl-title" x="0" y="6">His own shop's calendars</text><text class="tl-detail" x="0" y="22">"Radios, Electrical Appliances, Chestnut Street, Cressona"</text></g><path class="tl-mark tl-press" d="M126,191.763 130.6,196.363 126,200.963 121.4,196.363Z"/><path class="tl-tie" d="M133,196.363 150,196.363 150,479.5 160,479.5"/><g class="tl-row" transform="translate(168,479.5)"><text class="tl-date" x="0" y="-11">23 December 1948</text><text class="tl-title" x="0" y="6">30 N. Fourth conveyed to them</text><text class="tl-detail" x="0" y="22">From Eva Mae Mosher, for $1</text></g><path class="tl-mark tl-press" d="M126,215.853 130.6,220.453 126,225.053 121.4,220.453Z"/><path class="tl-tie" d="M133,220.453 150,220.453 150,541 160,541"/><g class="tl-row" transform="translate(168,541)"><text class="tl-date" x="0" y="-11">by 18 May 1949</text><text class="tl-title" x="0" y="6">Mother-Daughter banquet, St. Mark's</text><text class="tl-detail" x="0" y="22">Catherine, his mother and her own mother in one printed roll; the paper</text><text class="tl-detail" x="0" y="37">dates its page, not the evening</text></g><path class="tl-mark tl-record tl-bar" d="M126,272.311 126,277.293"/><path class="tl-tie" d="M133,274.802 150,274.802 150,602.5 160,602.5"/><g class="tl-row" transform="translate(168,602.5)"><text class="tl-date" x="0" y="-11">Apr 1950</text><text class="tl-title" x="0" y="6">Applies for state compensation</text><text class="tl-detail" x="0" y="22">Commonwealth computes thirty-two months overseas</text></g><path class="tl-mark tl-press" d="M126,275.314 130.6,279.914 126,284.514 121.4,279.914Z"/><path class="tl-tie" d="M133,279.914 150,279.914 150,664 160,664"/><g class="tl-row" transform="translate(168,664)"><text class="tl-date" x="0" y="-11">16 May 1950</text><text class="tl-title" x="0" y="6">Director, Cressona Lions</text><text class="tl-detail" x="0" y="22">Elected to a two-year seat for the year beginning 1 July; installed 27</text><text class="tl-detail" x="0" y="37">June</text></g><path class="tl-mark tl-press" d="M126,291.244 130.6,295.844 126,300.444 121.4,295.844Z"/><path class="tl-tie" d="M133,295.844 150,295.844 150,733 160,733"/><g class="tl-row" transform="translate(168,733)"><text class="tl-date" x="0" y="-11">22 Aug 1950</text><text class="tl-title" x="0" y="6">Women's Guild at St. Mark's</text><text class="tl-detail" x="0" y="22">Catherine and Helen both present; a clothing drive for children in Europe</text><text class="tl-detail" x="0" y="37">discussed</text></g><path class="tl-mark tl-press" d="M126,298.263 130.6,302.863 126,307.463 121.4,302.863Z"/><path class="tl-tie" d="M133,302.863 150,302.863 150,794.5 160,794.5"/><g class="tl-row" transform="translate(168,794.5)"><text class="tl-date" x="0" y="-11">Early October 1950</text><text class="tl-title" x="0" y="6">Commander, Legion Post 286</text><text class="tl-detail" x="0" y="22">Stanley Dengler Post, Cressona; installed by the 13th District commander</text></g><path class="tl-mark tl-record" d="M126,332.41 130.6,337.01 126,341.61 121.4,337.01Z"/><path class="tl-tie" d="M133,337.01 150,337.01 150,848.5 160,848.5"/><g class="tl-row" transform="translate(168,848.5)"><text class="tl-date" x="0" y="-11">30 Apr 1951</text><text class="tl-title" x="0" y="6">Certified electrician, Alcoa</text><text class="tl-detail" x="0" y="22">After a three-and-a-half-year apprenticeship</text></g><path class="tl-mark tl-press" d="M126,337.629 130.6,342.229 126,346.829 121.4,342.229Z"/><path class="tl-tie" d="M133,342.229 150,342.229 150,902.5 160,902.5"/><g class="tl-row" transform="translate(168,902.5)"><text class="tl-date" x="0" y="-11">June 1951</text><text class="tl-title" x="0" y="6">Incorporates the Memorial Park</text><text class="tl-detail" x="0" y="22">One of nine; playgrounds as a memorial to war veterans</text></g><path class="tl-mark tl-family" d="M126,557.177 130.6,561.777 126,566.377 121.4,561.777Z"/><path class="tl-tie" d="M133,561.777 150,561.777 150,956.5 160,956.5"/><g class="tl-row" transform="translate(168,956.5)"><text class="tl-date" x="0" y="-11">3 Feb 1955</text><text class="tl-title" x="0" y="6">John is born</text><text class="tl-detail" x="0" y="22">John S. Sweigert, their second son</text></g><path class="tl-mark tl-family tl-bar" d="M126,556.303 126,616.091"/><path class="tl-tie" d="M133,586.197 150,586.197 150,1010.5 160,1010.5"/><g class="tl-row" transform="translate(168,1010.5)"><text class="tl-date" x="0" y="-11">Thanksgiving 1955 or 1956</text><text class="tl-title" x="0" y="6">Roofing the new house</text><text class="tl-detail" x="0" y="22">Up on the roof on Thanksgiving day</text></g><path class="tl-mark tl-press" d="M126,592.874 130.6,597.474 126,602.074 121.4,597.474Z"/><path class="tl-tie" d="M133,597.474 150,597.474 150,1072 160,1072"/><g class="tl-row" transform="translate(168,1072)"><text class="tl-date" x="0" y="-11">8 Sept 1955</text><text class="tl-title" x="0" y="6">Printed as Sweigert Sr.</text><text class="tl-detail" x="0" y="22">The Cressona birthday column for 9 September carries the suffix seven</text><text class="tl-detail" x="0" y="37">months before the 1956 page</text></g><path class="tl-mark tl-press" d="M126,596.312 130.6,600.912 126,605.512 121.4,600.912Z"/><path class="tl-tie" d="M133,600.912 150,600.912 150,1133.5 160,1133.5"/><g class="tl-row" transform="translate(168,1133.5)"><text class="tl-date" x="0" y="-11">29 Sept 1955</text><text class="tl-title" x="0" y="6">Sells 30 N. Fourth</text><text class="tl-detail" x="0" y="22">To build the Charles Street house</text></g><path class="tl-mark tl-press" d="M126,628.403 130.6,633.003 126,637.603 121.4,633.003Z"/><path class="tl-tie" d="M133,633.003 150,633.003 150,1187.5 160,1187.5"/><g class="tl-row" transform="translate(168,1187.5)"><text class="tl-date" x="0" y="-11">12 Apr 1956</text><text class="tl-title" x="0" y="6">Lions, father and son</text><text class="tl-detail" x="0" y="22">Father and son on one page, nine years into the club</text></g><path class="tl-mark tl-record" d="M126,700.285 130.6,704.885 126,709.485 121.4,704.885Z"/><path class="tl-tie" d="M133,704.885 150,704.885 150,1241.5 160,1241.5"/><g class="tl-row" transform="translate(168,1241.5)"><text class="tl-date" x="0" y="-11">25 June 1957</text><text class="tl-title" x="0" y="6">His church changes name</text><text class="tl-detail" x="0" y="22">Evangelical and Reformed becomes United Church of Christ</text></g><path class="tl-mark tl-record tl-bar" d="M126,675.879 126,735.667"/><path class="tl-tie" d="M133,705.773 150,705.773 150,1295.5 160,1295.5"/><g class="tl-row" transform="translate(168,1295.5)"><text class="tl-date" x="0" y="-11">1957</text><text class="tl-title" x="0" y="6">Wiring his own house</text><text class="tl-detail" x="0" y="22">Charles Street, built by "Father and Son"</text></g><path class="tl-mark tl-family" d="M126,712.286 130.6,716.886 126,721.486 121.4,716.886Z"/><path class="tl-tie" d="M133,716.886 150,716.886 150,1349.5 160,1349.5"/><g class="tl-row" transform="translate(168,1349.5)"><text class="tl-date" x="0" y="-11">1957</text><text class="tl-title" x="0" y="6">Kathy Keim is born</text><text class="tl-detail" x="0" y="22">John's wife; Jeremy and Jessica's mother</text></g><path class="tl-mark tl-press" d="M126,736.141 130.6,740.741 126,745.341 121.4,740.741Z"/><path class="tl-tie" d="M133,740.741 150,740.741 150,1403.5 160,1403.5"/><g class="tl-row" transform="translate(168,1403.5)"><text class="tl-date" x="0" y="-11">31 Jan 1958</text><text class="tl-title" x="0" y="6">Named unit foreman</text><text class="tl-detail" x="0" y="22">Electrical department, Cressona Alcoa plant</text></g><path class="tl-mark tl-press" d="M126,818.06 130.6,822.66 126,827.26 121.4,822.66Z"/><path class="tl-tie" d="M133,822.66 150,822.66 150,1457.5 160,1457.5"/><g class="tl-row" transform="translate(168,1457.5)"><text class="tl-date" x="0" y="-11">14 June 1959</text><text class="tl-title" x="0" y="6">His father retires from the railroad</text><text class="tl-detail" x="0" y="22">Earl J. Sweigert, engineer for the Reading Railroad, after 43 years</text></g><path class="tl-mark tl-press" d="M126,1136.28 130.6,1140.88 126,1145.48 121.4,1140.88Z"/><path class="tl-tie" d="M133,1140.88 150,1140.88 150,1511.5 160,1511.5"/><g class="tl-row" transform="translate(168,1511.5)"><text class="tl-date" x="0" y="-11">10 October 1964</text><text class="tl-title" x="0" y="6">His parents' golden wedding</text><text class="tl-detail" x="0" y="22">Fifty years; a family dinner at Reeser's in Reading</text></g><path class="tl-mark tl-press" d="M126,1220.32 130.6,1224.92 126,1229.52 121.4,1224.92Z"/><path class="tl-tie" d="M133,1224.92 150,1224.92 150,1565.5 160,1565.5"/><g class="tl-row" transform="translate(168,1565.5)"><text class="tl-date" x="0" y="-11">6 Mar 1966</text><text class="tl-title" x="0" y="6">Elder, pulpit committee chair</text><text class="tl-detail" x="0" y="22">At the installation of the minister he had called</text></g><path class="tl-mark tl-press" d="M126,1403.85 130.6,1408.45 126,1413.05 121.4,1408.45Z"/><path class="tl-tie" d="M133,1408.45 150,1408.45 150,1619.5 160,1619.5"/><g class="tl-row" transform="translate(168,1619.5)"><text class="tl-date" x="0" y="-11">1 April 1969</text><text class="tl-title" x="0" y="6">Mill maintenance shift foreman</text><text class="tl-detail" x="0" y="22">His second foreman's post at Cressona Works, eleven years after the first</text></g><path class="tl-mark tl-press" d="M126,1455.14 130.6,1459.74 126,1464.34 121.4,1459.74Z"/><path class="tl-tie" d="M133,1459.74 150,1459.74 150,1673.5 160,1673.5"/><g class="tl-row" transform="translate(168,1673.5)"><text class="tl-date" x="0" y="-11">10 Feb 1970</text><text class="tl-title" x="0" y="6">The family address in print</text><text class="tl-detail" x="0" y="22">A newspaper report places the household on Charles Street</text></g><path class="tl-mark tl-family tl-bar" d="M126,1572.7 126,1632.48"/><path class="tl-tie" d="M133,1602.59 150,1602.59 150,1727.5 160,1727.5"/><g class="tl-row" transform="translate(168,1727.5)"><text class="tl-date" x="0" y="-11">about 1972</text><text class="tl-title" x="0" y="6">Melvin Jones Fellow</text><text class="tl-detail" x="0" y="22">Dated only by this document's own arithmetic; the obituary gives no year</text></g><path class="tl-mark tl-press tl-bar" d="M126,1632.48 126,1637.47"/><path class="tl-tie" d="M133,1634.98 150,1634.98 150,1789 160,1789"/><g class="tl-row" transform="translate(168,1789)"><text class="tl-date" x="0" y="-11">January 1973</text><text class="tl-title" x="0" y="6">Twenty-five years at Alcoa</text><text class="tl-detail" x="0" y="22">Into the 25 Year Club; the count puts his service date at about January</text><text class="tl-detail" x="0" y="37">1948</text></g><path class="tl-mark tl-press" d="M126,1797.22 130.6,1801.82 126,1806.42 121.4,1801.82Z"/><path class="tl-tie" d="M133,1801.82 150,1801.82 150,1850.5 160,1850.5"/><g class="tl-row" transform="translate(168,1850.5)"><text class="tl-date" x="0" y="-11">30 Oct 1975</text><text class="tl-title" x="0" y="6">John and Kathy are engaged</text><text class="tl-detail" x="0" y="22">Announced with her photograph; a June 1976 wedding planned</text></g><path class="tl-mark tl-memory tl-bar" d="M126,1871.64 126,1931.42"/><path class="tl-tie" d="M133,1901.53 150,1901.53 150,1904.5 160,1904.5"/><g class="tl-row" transform="translate(168,1904.5)"><text class="tl-date" x="0" y="-11">1977</text><text class="tl-title tl-remembered" x="0" y="6">The plant shuts down</text><text class="tl-detail" x="0" y="22">Alcoa closes Cressona; he retires after thirty years</text></g><path class="tl-mark tl-press" d="M126,1952.56 130.6,1957.16 126,1961.76 121.4,1957.16Z"/><path class="tl-tie" d="M133,1957.16 150,1957.16 150,1966 160,1966"/><g class="tl-row" transform="translate(168,1966)"><text class="tl-date" x="0" y="-11">by 5 June 1978</text><text class="tl-title" x="0" y="6">His father's estate settled</text><text class="tl-detail" x="0" y="22">Allen as executor; Earl J. Sweigert was dead by this date and no closer</text><text class="tl-detail" x="0" y="37">one is known</text></g><path class="tl-mark tl-family" d="M126,1964.98 130.6,1969.58 126,1974.18 121.4,1969.58Z"/><path class="tl-tie" d="M133,1969.58 150,1969.58 150,2027.5 160,2027.5"/><g class="tl-row" transform="translate(168,2027.5)"><text class="tl-date" x="0" y="-11">1978</text><text class="tl-title" x="0" y="6">Jeremy is born</text><text class="tl-detail" x="0" y="22">who would set up the camera in 2006</text></g><g class="tl-stick" transform="translate(92,1987.21)"><path class="tl-stick-bar" d="M0,0 0,59.7879"/><path class="tl-stick-bar" d="M-4,0 4,0"/><path class="tl-stick-bar" d="M-4,59.7879 4,59.7879"/><text class="tl-stick-label" x="8" y="33.8939">one year</text></g><text class="pl-kicker" x="8" y="22">A LIFE IN BRIEF · 3 of 4</text><text class="pl-title" x="8" y="48">Cressona, and the plant, 1947–1979</text><text class="pl-sub" x="8" y="66">35 entries. The rail at the left runs to scale; the rows do not, and a bracket joins each to its own moment.</text></svg>